<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mufradat — Arabic Vocabulary</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0F1B2D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mufradat">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400..700&family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1B2D;
    --panel:#16233A;
    --panel-2:#1C2C47;
    --gold:#C9A24B;
    --gold-soft:#e3c988;
    --teal:#2FA6A0;
    --teal-soft:#7FD4CE;
    --text:#F2ECDD;
    --text-muted:#93A4BC;
    --danger:#C1554A;
    --good:#4CA57A;
    --border:rgba(201,162,75,0.28);
    --radius:6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, rgba(47,166,160,0.10), transparent 55%),
      radial-gradient(ellipse at 90% 0%, rgba(201,162,75,0.10), transparent 45%),
      var(--ink);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--gold); color:var(--ink);}

  /* ---------- pattern band ---------- */
  .tile-band{
    height:14px;
    width:100%;
    background-image: repeating-linear-gradient(45deg, rgba(201,162,75,0.5) 0 2px, transparent 2px 14px),
                       repeating-linear-gradient(-45deg, rgba(47,166,160,0.4) 0 2px, transparent 2px 14px);
    opacity:0.65;
  }

  /* ---------- header ---------- */
  header{
    padding:28px 6vw 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
    border-bottom:1px solid var(--border);
    position:relative;
  }
  .brand{display:flex; align-items:baseline; gap:12px; cursor:pointer; flex-shrink:0;}
  .brand-ar{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:30px; color:var(--gold); font-weight:700;}
  .brand-en{font-family:'Fraunces',serif; font-size:22px; font-weight:600; letter-spacing:0.01em;}
  .brand-sub{font-size:11px; color:var(--text-muted); letter-spacing:0.14em; text-transform:uppercase; margin-top:2px;}

  .search-wrap{position:relative; flex:1; max-width:420px; min-width:220px;}
  .search-wrap input{
    width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    padding:11px 14px;
    border-radius:var(--radius);
    font-size:14px;
    font-family:'Inter',sans-serif;
  }
  .search-wrap input:focus{outline:none; border-color:var(--gold);}
  .search-results{
    position:absolute; top:calc(100% + 6px); left:0; right:0;
    background:var(--panel-2); border:1px solid var(--border); border-radius:var(--radius);
    max-height:340px; overflow-y:auto; z-index:50; display:none;
  }
  .search-results.show{display:block;}
  .search-row{padding:10px 14px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.05); cursor:default;}
  .search-row:last-child{border-bottom:none;}
  .search-row .ar{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:19px; color:var(--gold-soft);}
  .search-row .meta{font-size:12px; color:var(--text-muted); text-align:right;}
  .search-empty{padding:14px; font-size:13px; color:var(--text-muted);}

  nav.pillnav{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .pill{
    background:transparent; border:1px solid var(--border); color:var(--text-muted);
    padding:9px 16px; border-radius:999px; font-size:13px; cursor:pointer; font-family:'Inter',sans-serif;
    transition:all .15s ease; white-space:nowrap;
  }
  .pill:hover{border-color:var(--gold); color:var(--text);}
  .pill.active{background:var(--gold); border-color:var(--gold); color:var(--ink); font-weight:600;}

  .learn-dropdown{position:relative; flex-shrink:0;}
  .learn-menu{
    position:absolute; top:100%; right:0; margin-top:8px; background:var(--panel-2); border:1px solid var(--gold);
    border-radius:10px; padding:6px; min-width:210px; box-shadow:0 10px 30px rgba(0,0,0,0.5); z-index:150;
  }
  .learn-menu-item{
    display:block; width:100%; text-align:left; background:none; border:none; color:var(--text);
    padding:10px 12px; border-radius:6px; font-size:13.5px; cursor:pointer; font-family:'Inter',sans-serif;
    transition:background .15s ease;
  }
  .learn-menu-item:hover{background:rgba(201,162,75,0.12);}

  .tashkeel-toggle{
    background:transparent; border:1px solid var(--teal); color:var(--teal-soft);
    padding:9px 16px; border-radius:999px; font-size:12.5px; cursor:pointer; font-family:'Inter',sans-serif;
    display:flex; align-items:center; gap:8px; transition:all .15s ease;
  }
  .tashkeel-toggle:hover{background:rgba(47,166,160,0.1);}
  .tashkeel-toggle.on{background:var(--teal); border-color:var(--teal); color:var(--ink); font-weight:600;}
  .tk-sample{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:16px;}

  main{padding:34px 6vw 80px; max-width:1180px; margin:0 auto;}

  /* ---------- hero ---------- */
  .hero{padding:26px 0 44px; text-align:center;}
  .hero-flash{
    font-family:'Noto Naskh Arabic','Amiri',serif; font-size:clamp(48px,9vw,88px); color:var(--gold);
    height:1.3em; display:flex; align-items:center; justify-content:center;
    transition:opacity .5s ease;
  }
  .hero-flash-en{font-size:14px; color:var(--text-muted); letter-spacing:0.08em; text-transform:uppercase; margin-top:6px;}
  .hero-title{font-family:'Fraunces',serif; font-size:clamp(28px,4vw,44px); font-weight:600; margin:22px 0 10px;}
  .hero-title em{color:var(--teal-soft); font-style:normal;}
  .hero-desc{color:var(--text-muted); font-size:15px; max-width:560px; margin:0 auto 22px; line-height:1.6;}
  .hero-stats{display:flex; gap:30px; justify-content:center; margin-top:18px; flex-wrap:wrap;}
  .streak-sub{text-align:center; font-size:11.5px; color:var(--text-muted); margin-top:10px;}
  .due-today-banner{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    background:linear-gradient(135deg, rgba(201,162,75,0.12), rgba(47,166,160,0.08));
    border:1px solid var(--gold); border-radius:8px; padding:18px 22px; margin:20px 0;
  }
  .due-today-title{font-family:'Fraunces',serif; font-weight:600; font-size:16px;}
  .due-today-sub{font-size:12px; color:var(--text-muted); margin-top:4px; max-width:480px;}
  .continue-banner{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    background:linear-gradient(135deg, rgba(47,166,160,0.12), rgba(201,162,75,0.08));
    border:1px solid var(--teal); border-radius:8px; padding:18px 22px; margin:20px 0;
  }
  .continue-title{font-family:'Fraunces',serif; font-weight:600; font-size:16px;}
  .continue-sub{font-size:12px; color:var(--text-muted); margin-top:4px;}

  /* ---------- roots ---------- */
  .root-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px;}
  .root-card{
    background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:20px;
  }
  .root-letters{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:28px; color:var(--gold-soft); direction:rtl; letter-spacing:4px;}
  .root-meaning{font-size:12.5px; color:var(--teal-soft); margin:4px 0 14px; font-style:italic;}

  /* ---------- how sentences work (grammar guide) ---------- */
  .pos-legend{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; margin-top:6px;}
  .pos-card{background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:14px;}
  .pos-tag-badge{
    display:inline-block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em;
    padding:3px 9px; border-radius:999px; margin-bottom:8px;
  }
  .tag-n{background:rgba(201,162,75,0.18); color:var(--gold);}
  .tag-v{background:rgba(47,166,160,0.18); color:var(--teal-soft);}
  .tag-adj{background:rgba(76,165,122,0.18); color:var(--good);}
  .tag-pron{background:rgba(227,201,136,0.18); color:var(--gold-soft);}
  .tag-prep{background:rgba(127,212,206,0.18); color:var(--teal-soft);}
  .tag-part{background:rgba(193,85,74,0.18); color:var(--danger);}
  .tag-adv{background:rgba(147,164,188,0.18); color:var(--text-muted);}
  .tag-num{background:rgba(201,162,75,0.12); color:var(--gold-soft); border:1px dashed rgba(201,162,75,0.4);}
  .pos-example{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:18px; color:var(--text); direction:rtl; display:block; margin-bottom:6px;}
  .pos-desc{font-size:12px; color:var(--text-muted); line-height:1.5;}

  .diagram-list{display:flex; flex-direction:column; gap:16px; margin-bottom:28px;}
  .sentence-diagram{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:20px 22px;}
  .diagram-kind{font-size:11px; color:var(--teal-soft); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:10px;}
  .diagram-ar{
    font-family:'Noto Naskh Arabic','Amiri',serif; font-size:26px; color:var(--gold-soft); direction:rtl;
    display:flex; align-items:center; gap:12px; justify-content:flex-end;
  }
  .diagram-speak-btn{flex-shrink:0; width:32px; height:32px; font-size:13px;}
  .diagram-en{font-size:13px; color:var(--text-muted); font-style:italic; margin:6px 0 16px; text-align:right;}
  .diagram-words{display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end;}
  .diagram-word{
    background:var(--panel-2); border:1px solid var(--border); border-radius:8px; padding:10px 12px;
    display:flex; flex-direction:column; align-items:center; gap:6px; min-width:100px;
  }
  .diagram-word-ar-btn{
    background:none; border:none; cursor:pointer; font-family:'Noto Naskh Arabic','Amiri',serif;
    font-size:19px; color:var(--text); direction:rtl; padding:0;
  }
  .diagram-word-ar-btn:hover{color:var(--gold-soft);}
  .diagram-word-en{font-size:11px; color:var(--text-muted);}
  .grammar-cta{display:flex; gap:12px; flex-wrap:wrap; margin:8px 0 20px;}

  .root-word-row{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    padding:9px 0; border-bottom:1px dashed var(--border);
  }
  .root-word-row:last-child{border-bottom:none;}
  .root-word-ar{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:19px; direction:rtl; color:var(--text);}
  .root-word-meta{font-size:11.5px; color:var(--text-muted); text-align:right; flex:1;}
  .root-speak-btn{width:28px; height:28px; font-size:11px; flex-shrink:0;}
  .stat{text-align:center;}
  .stat-num{font-family:'Fraunces',serif; font-size:26px; color:var(--teal-soft); font-weight:600;}
  .stat-label{font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.1em;}

  /* ---------- category grid ---------- */
  .section-label{
    font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--teal-soft);
    margin:44px 0 16px; display:flex; align-items:center; gap:10px;
  }
  .section-label::after{content:''; flex:1; height:1px; background:var(--border);}

  .cat-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px;}
  .cat-card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px; cursor:pointer; transition:transform .18s ease, border-color .18s ease, background .18s ease;
    position:relative; overflow:hidden;
  }
  .cat-card:hover{transform:translateY(-3px); border-color:var(--gold); background:var(--panel-2);}
  .cat-card .icon{font-size:26px; margin-bottom:10px; display:block;}
  .cat-card .name-ar{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:21px; color:var(--gold-soft); display:block;}
  .cat-card .name-en{font-family:'Fraunces',serif; font-size:17px; font-weight:600; margin-top:2px;}
  .cat-card .count{font-size:12px; color:var(--text-muted); margin-top:8px;}

  /* ---------- progress status highlighting (shared by cat-card and sub-card) ---------- */
  .status-opened{border-color:var(--text-muted) !important;}
  .status-progress{border-color:var(--gold) !important; box-shadow:0 0 0 1px rgba(201,162,75,0.25);}
  .status-full{border-color:var(--good) !important; box-shadow:0 0 0 1px rgba(76,165,122,0.35);}
  .status-badge{
    position:absolute; top:10px; right:10px; font-size:10px; font-weight:700; letter-spacing:0.05em;
    padding:3px 8px; border-radius:999px; text-transform:uppercase;
  }
  .status-badge.status-opened{background:rgba(147,164,188,0.18); color:var(--text-muted); border:none !important;}
  .status-badge.status-progress{background:rgba(201,162,75,0.18); color:var(--gold-soft); border:none !important;}
  .status-badge.status-full{background:rgba(76,165,122,0.18); color:var(--good); border:none !important;}

  .crumbs{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-muted); margin-bottom:22px; flex-wrap:wrap;}
  .crumbs a{color:var(--teal-soft); cursor:pointer; text-decoration:none;}
  .crumbs a:hover{text-decoration:underline;}

  .sub-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; margin-bottom:10px;}
  .sub-card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:18px;
    position:relative;
  }
  .sub-card .name-en{font-family:'Fraunces',serif; font-size:17px; font-weight:600;}
  .sub-card .name-ar{font-family:'Noto Naskh Arabic','Amiri',serif; color:var(--gold-soft); font-size:16px; margin-left:6px;}
  .sub-card .count{font-size:12px; color:var(--text-muted); margin:6px 0 14px;}
  .coverage-row{display:flex; align-items:center; gap:10px; margin:-6px 0 14px;}
  .coverage-bar{flex:1; height:6px; border-radius:999px; background:var(--panel-2); overflow:hidden;}
  .coverage-fill{height:100%; background:linear-gradient(90deg, var(--teal), var(--gold)); border-radius:999px; transition:width .3s ease;}
  .coverage-label{font-size:10.5px; color:var(--text-muted); flex-shrink:0; white-space:nowrap;}
  .sub-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .sub-actions-games{margin-top:8px;}
  .sub-actions-games .btn{font-size:11px; padding:8px 12px;}
  .know-all-btn{
    display:block; width:100%; margin-top:8px; background:transparent; border:1px dashed var(--border);
    color:var(--text-muted); padding:8px; border-radius:5px; font-size:11.5px; cursor:pointer; transition:all .15s ease;
  }
  .know-all-btn:hover{border-color:var(--good); color:var(--good); border-style:solid;}
  .already-know-btn{
    display:block; width:100%; margin-top:12px; background:transparent; border:none;
    color:var(--text-muted); padding:6px; font-size:11.5px; cursor:pointer; text-decoration:underline;
    text-decoration-color:transparent; transition:all .15s ease;
  }
  .already-know-btn:hover{color:var(--good); text-decoration-color:var(--good);}
  .btn{
    border:1px solid var(--border); background:transparent; color:var(--text);
    padding:8px 13px; border-radius:var(--radius); font-size:12.5px; cursor:pointer; font-family:'Inter',sans-serif;
    transition:all .15s ease;
  }
  .btn:hover{border-color:var(--teal); color:var(--teal-soft);}
  .btn.primary{background:var(--gold); border-color:var(--gold); color:var(--ink); font-weight:600;}
  .btn.gold{background:transparent; border-color:var(--gold); color:var(--gold-soft); font-weight:600;}
  .btn.gold:hover{background:var(--gold); color:var(--ink);}
  .btn.primary:hover{background:var(--gold-soft); color:var(--ink);}
  .btn.teal{border-color:var(--teal); color:var(--teal-soft);}

  .word-preview{display:flex; flex-wrap:wrap; gap:6px 10px; margin-top:12px; padding-top:12px; border-top:1px dashed var(--border);}

  /* word tooltip spans */
  .w-tip{position:relative; cursor:help; border-bottom:1px dotted var(--gold-soft); font-family:'Noto Naskh Arabic','Amiri',serif; color:var(--text); font-size:15px;}
  .w-tip .tip-bubble{
    position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%);
    background:var(--gold); color:var(--ink); padding:6px 10px; border-radius:4px;
    font-family:'Inter',sans-serif; font-size:12px; white-space:nowrap; font-weight:600;
    opacity:0; pointer-events:none; transition:opacity .15s ease; z-index:60;
  }
  .w-tip .tip-bubble::after{
    content:''; position:absolute; top:100%; left:50%; transform:translateX(-50%);
    border:5px solid transparent; border-top-color:var(--gold);
  }
  .w-tip:hover .tip-bubble, .w-tip.show-tip .tip-bubble{opacity:1;}

  /* ---------- flashcards ---------- */
  .fc-wrap{display:flex; flex-direction:column; align-items:center; padding:20px 0;}
  .fc-progress{width:100%; max-width:480px; height:4px; background:var(--panel); border-radius:99px; overflow:hidden; margin-bottom:26px;}
  .fc-progress-bar{height:100%; background:linear-gradient(90deg,var(--teal),var(--gold)); transition:width .3s ease;}
  .fc-meta{font-size:12px; color:var(--text-muted); margin-bottom:10px; letter-spacing:0.06em; text-transform:uppercase;}

  .card{
    width:100%; max-width:480px; height:290px; perspective:1400px; cursor:pointer; margin-bottom:22px;
  }
  .card-inner{
    position:relative; width:100%; height:100%; transition:transform .5s cubic-bezier(.4,.2,.2,1); transform-style:preserve-3d;
  }
  .card.flipped .card-inner{transform:rotateY(180deg);}
  .card-face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:12px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    border:1px solid var(--border); padding:24px;
  }
  .card-front{background:linear-gradient(160deg,var(--panel),var(--panel-2));}
  .card-back{background:linear-gradient(160deg,var(--panel-2),var(--panel)); transform:rotateY(180deg);}
  .card-word{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:52px; color:var(--gold-soft); direction:rtl;}
  .card-pos{font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.1em; margin-top:14px;}
  .card-translit{font-family:'Fraunces',serif; font-size:15px; color:var(--text-muted); margin-top:10px; font-style:italic;}
  .card-en{font-family:'Fraunces',serif; font-size:30px; font-weight:600; color:var(--text);}
  .card-ex{margin-top:16px; font-size:13px; color:var(--text-muted); line-height:1.6;}
  .card-ex .ar{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:17px; color:var(--teal-soft); direction:rtl; display:block; margin-bottom:4px;}
  .card-hint{font-size:11px; color:var(--text-muted); margin-top:10px; letter-spacing:0.05em;}

  .fc-controls{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
  .fc-controls .btn{padding:11px 18px; font-size:13px;}
  .fc-controls .btn.know{border-color:var(--good); color:var(--good);}
  .fc-controls .btn.know:hover{background:var(--good); color:var(--ink);}
  .fc-controls .btn.back-btn{border-color:var(--text-muted); color:var(--text-muted);}
  .fc-controls .btn.back-btn:hover{border-color:var(--text); color:var(--text);}
  .fc-controls .btn.again{border-color:var(--danger); color:var(--danger);}
  .fc-controls .btn.again:hover{background:var(--danger); color:var(--ink);}

  .fc-done{text-align:center; padding:40px 0;}
  .fc-done .big{font-family:'Fraunces',serif; font-size:30px; margin-bottom:8px;}

  /* ---------- quiz ---------- */
  .quiz-wrap{max-width:520px; margin:0 auto; text-align:center;}
  .quiz-top-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px;}
  .quiz-top-row .quiz-score{margin-bottom:0; text-align:left;}
  .quiz-back-btn{font-size:12px; padding:7px 14px; flex-shrink:0;}
  .quiz-top-actions{display:flex; gap:8px; align-items:center; flex-shrink:0;}
  .practice-top-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:10px;}
  .practice-top-row .fc-meta{margin-bottom:0;}
  .exit-btn{
    background:transparent; border:1px solid var(--border); color:var(--text-muted);
    padding:6px 13px; border-radius:999px; font-size:11.5px; cursor:pointer; transition:all .15s ease; flex-shrink:0;
  }
  .exit-btn:hover{border-color:var(--danger); color:var(--danger);}

  /* ---------- practice timer (persistent floating widget) ---------- */
  .timer-widget{position:fixed; bottom:22px; right:20px; z-index:200; display:flex; flex-direction:column; align-items:flex-end; gap:10px;}
  .timer-fab{
    width:58px; height:58px; border-radius:50%; background:var(--gold); color:var(--ink); border:none;
    font-size:19px; font-weight:700; cursor:pointer; box-shadow:0 4px 18px rgba(0,0,0,0.45);
    display:flex; align-items:center; justify-content:center; transition:all .2s ease; font-family:'Fraunces',serif;
  }
  .timer-fab:hover{transform:scale(1.06);}
  .timer-fab.running{background:var(--teal); animation:timerPulse 2s infinite;}
  .timer-fab.ringing{background:var(--danger); animation:timerShake .4s infinite;}
  @keyframes timerPulse{0%,100%{box-shadow:0 4px 18px rgba(47,166,160,0.45);}50%{box-shadow:0 4px 26px rgba(47,166,160,0.85);}}
  @keyframes timerShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
  .timer-panel{
    background:var(--panel-2); border:1px solid var(--gold); border-radius:12px; padding:20px; width:260px;
    box-shadow:0 10px 36px rgba(0,0,0,0.55);
  }
  .timer-panel-title{font-family:'Fraunces',serif; font-weight:600; font-size:14px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;}
  .timer-panel-close{background:none; border:none; color:var(--text-muted); font-size:16px; cursor:pointer; padding:0;}
  .timer-display{font-family:'Fraunces',serif; font-size:34px; text-align:center; color:var(--gold-soft); margin-bottom:16px; letter-spacing:1px;}
  .timer-presets{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .timer-preset{
    flex:1; min-width:36px; background:transparent; border:1px solid var(--border); color:var(--text-muted);
    padding:7px 4px; border-radius:6px; font-size:11px; cursor:pointer; transition:all .15s ease;
  }
  .timer-preset:hover, .timer-preset.active{border-color:var(--gold); color:var(--gold-soft);}
  .timer-custom-label{font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); margin-bottom:6px;}
  .timer-custom-hms{display:flex; gap:6px; margin-bottom:16px; align-items:flex-end;}
  .timer-hms-field{display:flex; flex-direction:column; align-items:center; gap:3px; flex:1; min-width:0;}
  .timer-hms-field input{
    width:100%; text-align:center; background:var(--ink); border:1px solid var(--border); color:var(--text);
    padding:7px 4px; border-radius:6px; font-size:13px;
  }
  .timer-hms-field label{font-size:9.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.04em;}
  .timer-custom-hms .btn{padding:7px 12px; font-size:11px; flex-shrink:0; align-self:flex-end;}
  .timer-controls{display:flex; gap:8px;}
  .timer-controls .btn{flex:1; font-size:12px; padding:9px;}
  @media (max-width:640px){
    .timer-widget{bottom:16px; right:14px;}
    .timer-fab{width:52px; height:52px; font-size:17px;}
  }

  .quiz-score{font-size:12px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:18px;}
  .quiz-word{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:56px; color:var(--gold-soft); margin-bottom:6px; direction:rtl;}
  .quiz-translit{font-family:'Fraunces',serif; font-style:italic; color:var(--text-muted); margin-bottom:30px;}
  .quiz-speak-btn{display:inline-flex; vertical-align:middle; margin-left:12px; width:34px; height:34px; font-size:14px;}
  .quiz-direction-label{font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--teal-soft); margin-bottom:8px;}
  .quiz-word-en{font-family:'Fraunces',serif; font-size:32px; font-weight:600; color:var(--text); direction:ltr; margin-bottom:30px;}
  .quiz-opt-ar{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:19px; direction:rtl; text-align:right;}
  .card-speak-btn{position:absolute; top:14px; right:14px; width:32px; height:32px; font-size:13px;}
  .quiz-options{display:grid; gap:10px;}
  .quiz-opt{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px;
    cursor:pointer; font-size:15px; text-align:left; transition:all .15s ease;
  }
  .quiz-opt:hover{border-color:var(--teal);}
  .quiz-opt.correct{background:rgba(76,165,122,0.18); border-color:var(--good); color:var(--good);}
  .quiz-opt.wrong{background:rgba(193,85,74,0.18); border-color:var(--danger); color:var(--danger);}
  .quiz-opt.disabled{pointer-events:none;}
  .quiz-next{margin-top:20px;}

  /* ---------- sentences ---------- */
  .sentence-card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 20px; margin-bottom:12px;
  }
  .sentence-ar{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:22px; direction:rtl; text-align:right; line-height:1.9; display:flex; align-items:center; gap:12px; justify-content:flex-end;}
  .sentence-speak-btn{flex-shrink:0; width:32px; height:32px; font-size:13px;}
  .sentence-ar-centered{justify-content:center; flex-direction:row-reverse;}

  .sent-hub-actions{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:36px;}
  .sent-hub-btn{
    flex:1; min-width:260px; display:flex; align-items:center; gap:16px; text-align:left;
    background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:20px 22px;
    cursor:pointer; transition:all .18s ease;
  }
  .sent-hub-btn.primary:hover{border-color:var(--gold); background:rgba(201,162,75,0.08);}
  .sent-hub-btn.teal:hover{border-color:var(--teal); background:rgba(47,166,160,0.08);}
  .sent-hub-icon{font-size:30px; flex-shrink:0;}
  .sent-hub-title{display:block; font-family:'Fraunces',serif; font-size:16px; font-weight:600; color:var(--text);}
  .sent-hub-sub{display:block; font-size:12px; color:var(--text-muted); margin-top:3px;}

  .sent-mode-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;}

  .sentence-practice-card{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:36px 28px; max-width:640px; margin:0 auto; text-align:center;
  }

  /* ---------- matching game ---------- */
  .match-grid{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:10px;
  }
  .match-tile{
    background:var(--panel); border:1px solid var(--border); border-radius:8px;
    padding:18px 10px; min-height:64px; cursor:pointer; font-size:14px; color:var(--text);
    display:flex; align-items:center; justify-content:center; text-align:center;
    transition:all .15s ease; line-height:1.4;
  }
  .match-tile-ar{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:19px; direction:rtl;}
  .match-tile:hover{border-color:var(--teal);}
  .match-tile.selected{border-color:var(--gold); background:rgba(201,162,75,0.15); color:var(--gold-soft);}
  .match-tile.wrong{border-color:var(--danger); background:rgba(193,85,74,0.18); color:var(--danger); animation:matchShake .3s;}
  @keyframes matchShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
  @media (max-width:640px){
    .match-grid{grid-template-columns:repeat(2, 1fr);}
  }

  /* ---------- mosaic rush ---------- */
  /* One real geometric rosette (the classic 8-pointed zellige star, matching the
     border pattern used at the top of every page) lives behind the whole grid.
     Each tile is a cover that lifts away when answered correctly — so the
     artwork only reads as a coherent picture as the board fills in, the way a
     real mosaic is one image built of many small pieces, not repeated icons. */
  .mosaic-grid{
    position:relative;
    display:grid; grid-template-columns:repeat(5, 1fr); gap:4px;
    padding:10px; border-radius:10px; border:1px solid var(--border);
    background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20500%20400%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22sky%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%230F1B2D%22/%3E%3Cstop%20offset%3D%2250%25%22%20stop-color%3D%22%2316233A%22/%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%237a5f2e%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%22500%22%20height%3D%22400%22%20fill%3D%22url%28%23sky%29%22/%3E%3Ccircle%20cx%3D%2255%22%20cy%3D%2245%22%20r%3D%222%22%20fill%3D%22%23F2ECDD%22/%3E%3Ccircle%20cx%3D%22130%22%20cy%3D%2285%22%20r%3D%221.6%22%20fill%3D%22%23F2ECDD%22/%3E%3Ccircle%20cx%3D%22250%22%20cy%3D%2235%22%20r%3D%221.6%22%20fill%3D%22%23F2ECDD%22/%3E%3Ccircle%20cx%3D%22310%22%20cy%3D%2270%22%20r%3D%222%22%20fill%3D%22%23F2ECDD%22/%3E%3Ccircle%20cx%3D%2295%22%20cy%3D%22130%22%20r%3D%221.4%22%20fill%3D%22%23F2ECDD%22/%3E%3Ccircle%20cx%3D%22200%22%20cy%3D%2260%22%20r%3D%221.4%22%20fill%3D%22%23F2ECDD%22/%3E%3Ccircle%20cx%3D%22450%22%20cy%3D%22140%22%20r%3D%221.6%22%20fill%3D%22%23F2ECDD%22/%3E%3Ccircle%20cx%3D%22385%22%20cy%3D%2295%22%20r%3D%2236%22%20fill%3D%22%23e3c988%22/%3E%3Ccircle%20cx%3D%22400%22%20cy%3D%2284%22%20r%3D%2231%22%20fill%3D%22%2316233A%22/%3E%3Crect%20x%3D%22160%22%20y%3D%22330%22%20width%3D%22280%22%20height%3D%2255%22%20fill%3D%22%230a1420%22/%3E%3Cpath%20d%3D%22M%20250%20260%20A%2040%2040%200%200%201%20330%20260%20L%20330%20300%20L%20250%20300%20Z%22%20fill%3D%22%230a1420%22/%3E%3Crect%20x%3D%22245%22%20y%3D%22300%22%20width%3D%2290%22%20height%3D%2235%22%20fill%3D%22%230a1420%22/%3E%3Cline%20x1%3D%22290%22%20y1%3D%22220%22%20x2%3D%22290%22%20y2%3D%22182%22%20stroke%3D%22%230a1420%22%20stroke-width%3D%223%22/%3E%3Ccircle%20cx%3D%22290%22%20cy%3D%22179%22%20r%3D%225%22%20fill%3D%22%230a1420%22/%3E%3Crect%20x%3D%22140%22%20y%3D%22245%22%20width%3D%2218%22%20height%3D%22140%22%20fill%3D%22%230a1420%22/%3E%3Cpath%20d%3D%22M%20138%20245%20L%20149%20202%20L%20160%20245%20Z%22%20fill%3D%22%230a1420%22/%3E%3Cline%20x1%3D%22149%22%20y1%3D%22202%22%20x2%3D%22149%22%20y2%3D%22178%22%20stroke%3D%22%230a1420%22%20stroke-width%3D%222%22/%3E%3Ccircle%20cx%3D%22149%22%20cy%3D%22175%22%20r%3D%224%22%20fill%3D%22%230a1420%22/%3E%3Crect%20x%3D%22422%22%20y%3D%22245%22%20width%3D%2218%22%20height%3D%22140%22%20fill%3D%22%230a1420%22/%3E%3Cpath%20d%3D%22M%20420%20245%20L%20431%20202%20L%20442%20245%20Z%22%20fill%3D%22%230a1420%22/%3E%3Cline%20x1%3D%22431%22%20y1%3D%22202%22%20x2%3D%22431%22%20y2%3D%22178%22%20stroke%3D%22%230a1420%22%20stroke-width%3D%222%22/%3E%3Ccircle%20cx%3D%22431%22%20cy%3D%22175%22%20r%3D%224%22%20fill%3D%22%230a1420%22/%3E%3Cpath%20d%3D%22M%20270%20385%20L%20270%20352%20A%2020%2020%200%200%201%20310%20352%20L%20310%20385%20Z%22%20fill%3D%22%231C2C47%22/%3E%3Ccircle%20cx%3D%22210%22%20cy%3D%22315%22%20r%3D%229%22%20fill%3D%22%231C2C47%22/%3E%3Ccircle%20cx%3D%22370%22%20cy%3D%22315%22%20r%3D%229%22%20fill%3D%22%231C2C47%22/%3E%3C/svg%3E");
    background-size:cover; background-position:center;
  }
  .mosaic-tile{
    aspect-ratio:1; border-radius:3px; border:1px solid var(--border); background:var(--panel);
    transition:all .4s ease;
  }
  .mosaic-tile.filled{
    background:transparent; border-color:rgba(201,162,75,0.35);
    box-shadow:inset 0 0 6px rgba(0,0,0,0.35);
    animation:mosaicReveal .45s ease;
  }
  @keyframes mosaicReveal{from{opacity:0; transform:scale(0.6);} to{opacity:1; transform:scale(1);}}


  .sentence-toggle{
    margin-top:10px; font-size:12px; color:var(--teal-soft); cursor:pointer; letter-spacing:0.04em;
    display:inline-block; border-bottom:1px dotted var(--teal-soft);
  }
  .sentence-en{margin-top:8px; font-size:13.5px; color:var(--text-muted); display:none; line-height:1.6;}
  .sentence-en.show{display:block;}

  /* ---------- alphabet ---------- */
  .alpha-intro{color:var(--text-muted); font-size:14px; max-width:680px; line-height:1.7; margin-bottom:8px;}
  .alpha-note{
    display:inline-flex; align-items:center; gap:8px; font-size:12px; color:var(--teal-soft);
    background:rgba(47,166,160,0.08); border:1px solid rgba(47,166,160,0.28); border-radius:999px;
    padding:7px 14px; margin:14px 0 30px;
  }
  .alpha-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; margin-bottom:12px;}
  .letter-card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px;
    display:flex; flex-direction:column; gap:8px;
  }
  .letter-top{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .letter-speak-btn{flex-shrink:0;}
  .letter-big{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:44px; color:var(--gold-soft); direction:rtl;}
  .letter-names{text-align:right;}
  .letter-name-ar{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:15px; color:var(--text);}
  .letter-name-en{font-family:'Fraunces',serif; font-size:13px; color:var(--text-muted); font-style:italic;}
  .letter-forms{
    display:flex; justify-content:space-between; gap:6px; padding:10px 4px;
    border-top:1px dashed var(--border); border-bottom:1px dashed var(--border);
  }
  .letter-form{text-align:center; flex:1;}
  .letter-form .glyph{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:22px; direction:rtl; color:var(--teal-soft);}
  .letter-form .lbl{font-size:9px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.06em; margin-top:3px;}
  .letter-tip{font-size:12px; color:var(--text-muted); line-height:1.5;}
  .letter-example{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--panel-2); border-radius:5px; padding:8px 10px;
  }
  .letter-example .ex-word{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:18px; color:var(--gold-soft); direction:rtl;}
  .letter-example .ex-meta{font-size:11px; color:var(--text-muted);}
  .speak-btn{
    background:var(--gold); border:none; color:var(--ink); width:30px; height:30px; border-radius:50%;
    cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
    transition:transform .12s ease;
  }
  .speak-btn:hover{transform:scale(1.1);}
  .speak-btn:active{transform:scale(0.92);}

  .harakat-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; margin-bottom:10px;}
  .harakat-card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px; display:flex; align-items:center; gap:14px;}
  .harakat-speak-btn{flex-shrink:0;}
  .harakat-contrast{display:flex; align-items:center; gap:6px; flex-shrink:0;}
  .harakat-base{
    font-family:'Noto Naskh Arabic','Amiri',serif; font-size:26px; color:var(--text-muted);
    direction:rtl; text-align:center; opacity:0.65;
  }
  .harakat-arrow{color:var(--text-muted); font-size:13px; opacity:0.6;}
  .harakat-card-base{border-color:var(--gold);}
  .harakat-glyph-solo{font-size:46px; min-width:60px;}
  .harakat-glyph{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:38px; color:var(--gold-soft); direction:rtl; min-width:50px; text-align:center;}
  .harakat-info .name{font-family:'Fraunces',serif; font-weight:600; font-size:15px;}
  .harakat-info .desc{font-size:12px; color:var(--text-muted); margin-top:3px; line-height:1.5;}
  .harakat-extra{
    display:flex; align-items:center; gap:8px; margin-top:9px; padding-top:9px;
    border-top:1px dashed var(--border);
  }
  .harakat-extra-word{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:18px; color:var(--teal-soft); direction:rtl;}
  .harakat-extra-meta{font-size:11px; color:var(--text-muted); flex:1;}
  .harakat-extra-speak{width:26px; height:26px; font-size:10.5px; flex-shrink:0;}

  /* ---------- conjugations ---------- */
  .grammar-explainer{
    background:linear-gradient(160deg,var(--panel),var(--panel-2)); border:1px solid var(--border); border-radius:8px;
    padding:24px 26px; margin-bottom:30px;
  }
  .grammar-explainer h3{font-family:'Fraunces',serif; font-size:18px; font-weight:600; margin:0 0 12px;}
  .grammar-terms{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin:18px 0;}
  .grammar-term{background:var(--ink); border:1px solid var(--border); border-radius:6px; padding:14px 16px;}
  .grammar-term .term-name{font-family:'Fraunces',serif; font-weight:600; color:var(--gold-soft); font-size:14.5px; margin-bottom:5px;}
  .grammar-term .term-desc{font-size:12.5px; color:var(--text-muted); line-height:1.6;}
  .grammar-example{
    font-family:'Noto Naskh Arabic','Amiri',serif; direction:rtl; font-size:16px; color:var(--teal-soft);
    display:inline; margin-top:4px;
  }
  .example-chip{
    background:rgba(47,166,160,0.1); border:1px solid var(--border); color:var(--teal-soft);
    font-family:'Noto Naskh Arabic','Amiri',serif; font-size:14px; padding:3px 9px; border-radius:999px;
    cursor:pointer; margin:2px; transition:all .15s ease; direction:rtl;
  }
  .example-chip:hover{background:var(--teal); color:var(--ink); border-color:var(--teal);}
  .grammar-why{font-size:13.5px; color:var(--text); line-height:1.7; margin-top:14px; padding-top:14px; border-top:1px dashed var(--border);}

  .person-cell{display:flex; flex-direction:column; gap:4px;}
  .person-badges{display:flex; gap:5px;}
  .gn-badge{
    font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
    padding:2px 7px; border-radius:4px; border:1px solid var(--border); color:var(--text-muted);
  }
  .gn-badge.gender-M{border-color:var(--teal); color:var(--teal-soft);}
  .gn-badge.gender-F{border-color:var(--gold); color:var(--gold-soft);}
  .person-usage{font-size:10.5px; color:var(--text-muted); font-style:italic; max-width:170px; line-height:1.4;}

  .pattern-wrap{
    background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:22px 24px; margin-bottom:34px;
  }
  .pattern-verb{display:flex; align-items:baseline; gap:14px; margin-bottom:6px; flex-wrap:wrap;}
  .pattern-verb .big{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:34px; color:var(--gold-soft); direction:rtl;}
  .pattern-verb .meta{font-size:13px; color:var(--text-muted);}
  .pattern-legend{display:flex; gap:18px; flex-wrap:wrap; margin:14px 0 20px; font-size:12px;}
  .legend-item{display:flex; align-items:center; gap:6px; color:var(--text-muted);}
  .legend-swatch{width:12px; height:12px; border-radius:3px; display:inline-block;}
  .sw-prefix{background:var(--teal);}
  .sw-stem{background:var(--text-muted);}
  .sw-suffix{background:var(--gold);}
  .aff-pre{color:var(--teal-soft); font-weight:700;}
  .aff-stem{color:var(--text);}
  .aff-suf{color:var(--gold-soft); font-weight:700;}

  .conj-table{width:100%; border-collapse:collapse; font-size:14px;}
  .conj-table th{
    text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted);
    padding:6px 10px; border-bottom:1px solid var(--border);
  }
  .conj-table td{padding:8px 10px; border-bottom:1px solid rgba(255,255,255,0.04); vertical-align:middle;}

  .form-num{font-family:'Fraunces',serif; font-weight:700; font-size:15px; color:var(--gold-soft); text-align:center;}
  .form-pattern{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:19px; color:var(--text); direction:rtl;}
  .form-mean{font-size:12.5px; color:var(--text-muted); line-height:1.5;}
  .form-ex{display:flex; flex-direction:column; align-items:flex-end; text-align:right;}
  .form-ex .ar{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:16px; color:var(--teal-soft); direction:rtl;}
  .form-ex-t{font-size:10.5px; color:var(--text-muted); font-style:italic; margin-top:2px;}

    .form-row{grid-template-columns:1fr; text-align:left; gap:6px;}
    .form-ex{align-items:flex-start; text-align:left;}

  .verb-detail-header{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;

  }
  .verb-detail-header .v-ar{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:40px; color:var(--gold-soft); direction:rtl;}
  .verb-detail-header .v-en{font-family:'Fraunces',serif; font-size:18px; font-weight:600;}
  .verb-detail-header .v-root{font-size:12px; color:var(--text-muted); margin-top:4px;}

    background:rgba(201,162,75,0.08); border:1px solid var(--border); border-radius:6px;

  .diff-pill.medium .dot{background:var(--teal-soft);}
  .diff-pill.hard .dot{background:var(--gold);}
  .diff-pill.expert .dot{background:var(--danger);}
  .diff-pill.mixed .dot{background:linear-gradient(90deg,var(--good),var(--teal-soft),var(--gold),var(--danger));}
  .diff-pill:hover{border-color:var(--text-muted); color:var(--text);}
  .diff-pill.active{border-color:var(--text); color:var(--text); background:rgba(255,255,255,0.06);}
  .diff-desc{font-size:12.5px; color:var(--text-muted); margin:4px 0 18px; min-height:18px;}
  .quick-actions{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:28px;}

  .diff-badge{
    display:inline-block; font-size:9.5px; text-transform:uppercase; letter-spacing:0.06em; font-weight:700;

  .diff-badge.easy{background:rgba(76,165,122,0.15); color:var(--good);}
  .diff-badge.medium{background:rgba(127,212,206,0.15); color:var(--teal-soft);}
  .diff-badge.hard{background:rgba(201,162,75,0.15); color:var(--gold);}
  .diff-badge.expert{background:rgba(193,85,74,0.15); color:var(--danger);}

    .brand-sub{display:none;}

/* ============================= HELPERS FOR EXTENDED VOCAB ============================= */
function autoSentence(w){
  const a = w.a;
  if(a.indexOf(" ")!==-1){ return {s:a, x:w.e}; }
  if(w.p==="n"){
    const fem = /[ةاؤء]$/.test(a) || /ى$/.test(a);
    return fem ? {s:"هذه ال"+a+" جميلة.", x:"This "+w.e+" is beautiful."}
                : {s:"هذا ال"+a+" جميل.", x:"This "+w.e+" is beautiful."};
  }
  if(w.p==="v"){ return {s:"هو "+a+" أمس.", x:"He did this — "+w.e+" (past tense)."}; }
  if(w.p==="adj"){ return {s:"هذا الشيء "+a+" جداً.", x:"This thing is very "+w.e+"."}; }
  if(w.p==="num"){ return {s:"العدد هو "+a+".", x:"The number is "+w.e+"."}; }
  return {s:a, x:w.e};
}
function mkWords(list){
  return list.map(t=>{
    const w = {a:t[0], t:t[1], e:t[2], p:t[3]};
    if(t[4]) w.tk = t[4];
    const auto = autoSentence(w);
    w.s = auto.s; w.x = auto.x; w.auto = true;
    return w;
  });
}

      note:"You may have noticed: there's no Arabic word for \"am / is / are.\" That's not a gap in this app — Arabic genuinely doesn't use a linking verb in the present tense. \"I am happy\" is just أنا سعيد (literally \"I happy\") — two words placed side by side. This category covers exactly the words English speakers expect to find and don't: how \"my / your / his / her\" attach directly onto nouns instead of standing alone, how \"me / you / him\" attach onto verbs the same way, how to say \"I have\" (Arabic has no verb \"to have\" either — it uses \"at me\"), the word for \"the,\" and the small particles that carry huge grammatical weight (negation, emphasis, future tense).",

      { id:"possessive-suffixes", en:"Possessive Suffixes — \"my/your/his...\"", ar:"ضمائر الملكية", arTk:"ضَمَائِر المِلْكِيَّة", words:[

let _currentUtterance = null; // Safari has a known bug where an utterance referenced only by
// a local variable can get garbage-collected mid-speech and cut out — keeping a persistent
// reference here prevents that.
function speak(text){
  if(!("speechSynthesis" in window)){
    alert("Your browser doesn't support text-to-speech. Try Chrome, Edge, or Safari.");
    return;
  }
  // iOS Safari requires speak() to run synchronously inside the exact call stack of the
  // user's tap — any delay (even a short setTimeout) can cause it to silently refuse to
  // speak. Everything here runs synchronously, with no async gaps, in direct response to
  // the click that called this function. resume() clears a "stuck paused" state iOS can
  // get into after the tab is backgrounded.
  window.speechSynthesis.resume();
  if(window.speechSynthesis.speaking || window.speechSynthesis.pending){
    window.speechSynthesis.cancel();
  }
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "ar-SA";
  utter.rate = 0.75;
  _currentUtterance = utter;
  window.speechSynthesis.speak(utter);
}
// iOS Safari's speech engine sometimes needs "unlocking" by the very first user gesture on
// the page, the same way autoplay audio does. Fire a near-silent primer on the first tap
// anywhere, so later real speak() calls are more likely to actually work.
let _speechPrimed = false;
function primeSpeechSynthesis(){
  if(_speechPrimed || !("speechSynthesis" in window)) return;
  _speechPrimed = true;
  try{
    const primer = new SpeechSynthesisUtterance(" ");
    primer.volume = 0;
    window.speechSynthesis.speak(primer);
  }catch(e){ /* ignore — this is just a best-effort unlock */ }
}
document.addEventListener("touchstart", primeSpeechSynthesis, {once:true, passive:true});
document.addEventListener("click", primeSpeechSynthesis, {once:true});

function todayString(offsetDays){
  const d = new Date();
  if(offsetDays) d.setDate(d.getDate()-offsetDays);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
let _streakUpdatedThisSession = false;
function recordActivityToday(){
  const today = todayString();
  if(STREAK.lastActiveDate === today){ return; }
  const yesterday = todayString(1);
  STREAK.current = (STREAK.lastActiveDate === yesterday) ? (STREAK.current||0) + 1 : 1;
  STREAK.longest = Math.max(STREAK.longest||0, STREAK.current);
  STREAK.totalDaysActive = (STREAK.totalDaysActive||0) + 1;
  STREAK.lastActiveDate = today;
  _streakUpdatedThisSession = true;
  saveStreak();
}

// Called by every practice mode when it starts on a specific subcategory — records
// enough to rebuild a "Continue where you left off" card on the home page later.
function recordLastActivity(mode, catId, subId){
  if(!catId || !subId) return; // only track subcategory-scoped sessions, not "all words" mixes
  const cat = DATA.categories.find(c=>c.id===catId);
  const sub = cat && cat.subs.find(s=>s.id===subId);
  if(!cat || !sub) return;
  LAST_ACTIVITY = { mode, catId, subId, catEn:cat.en, subEn:sub.en, ts:Date.now() };
  saveLastActivityNow();
  markSubVisited(subId);
}
function resumeLastActivity(){
  if(!LAST_ACTIVITY) return;
  const { mode, catId, subId } = LAST_ACTIVITY;
  const cat = DATA.categories.find(c=>c.id===catId);
  const sub = cat && cat.subs.find(s=>s.id===subId);
  if(!cat || !sub){ showToast("That subcategory isn't available anymore."); return; }
  if(mode==="flashcards") startFlashcards(catId, subId);
  else if(mode==="quiz") startQuiz(catId, subId);
  else if(mode==="match") startMatchingGame(sub.words, sub.en, catId, subId);
  else if(mode==="tashkeel") startTashkeelChallenge(sub.words, sub.en, catId, subId);
  else if(mode==="mosaic") startMosaicRush(sub.words, sub.en, catId, subId);
  else if(mode==="sentences") renderSentences(catId, subId);
  else renderCategory(catId);
}

  if(startedCount > 0) return "progress";
  if(VISITED_SUBS.has(sub.id)) return "opened";
  return "none";
}
// Aggregates all of a category's subcategories into one overall status for the top-level grid.
function getCatStatus(cat){
  const statuses = cat.subs.map(getSubStatus);
  if(statuses.every(s=>s==="full")) return "full";
  if(statuses.some(s=>s==="full"||s==="progress")) return "progress";
  if(statuses.some(s=>s==="opened")) return "opened";
  return "none";
}
const STATUS_LABELS = { opened:"Opened", progress:"In Progress", full:"Mastered" };
function statusBadgeHtml(status){
  if(!STATUS_LABELS[status]) return "";
  return `<span class="status-badge status-${status}">${STATUS_LABELS[status]}</span>`;
}

// Sentence practice (Random Practice / Meaning Quiz / viewing the list) is a genuinely
// different activity from vocab drilling, and uses the same underlying words — so it must
// NOT reuse getSubStatus/getCatStatus above, or a subcategory mastered purely through
// Flashcards would misleadingly show as "in progress"/"mastered" on the Sentences pages
// too, even though its sentences had never actually been opened. There's also no real
// per-sentence "mastery" concept the way there is for vocab words, so this is intentionally
// just a binary visited/not-visited signal rather than fake progress/full precision.
const SENTENCE_VISITED_KEY = "visited-sentence-subs-v1";
let VISITED_SENTENCE_SUBS = new Set();
async function loadVisitedSentenceSubs(){
  try{
    let raw = null;
    if(STORAGE_BACKEND === "claude"){
      const res = await window.storage.get(SENTENCE_VISITED_KEY, false);
      if(res && res.value) raw = res.value;
    } else if(STORAGE_BACKEND === "local"){
      raw = localStorage.getItem(SENTENCE_VISITED_KEY);
    } else if(_memoryStore[SENTENCE_VISITED_KEY]){
      raw = _memoryStore[SENTENCE_VISITED_KEY];
    }
    if(raw) VISITED_SENTENCE_SUBS = new Set(JSON.parse(raw));
  }catch(e){ /* none yet */ }
}
async function saveVisitedSentenceSubsNow(){
  const json = JSON.stringify(Array.from(VISITED_SENTENCE_SUBS));
  try{
    if(STORAGE_BACKEND === "claude") await window.storage.set(SENTENCE_VISITED_KEY, json, false);
    else if(STORAGE_BACKEND === "local") localStorage.setItem(SENTENCE_VISITED_KEY, json);
    else _memoryStore[SENTENCE_VISITED_KEY] = json;
  }catch(e){ console.warn("Visited-sentence-subs save failed", e); }
}
function markSentenceSubVisited(subId){
  if(!subId || VISITED_SENTENCE_SUBS.has(subId)) return;
  VISITED_SENTENCE_SUBS.add(subId);
  saveVisitedSentenceSubsNow();
}
function getSentenceSubStatus(sub){
  return VISITED_SENTENCE_SUBS.has(sub.id) ? "opened" : "none";
}
function getSentenceCatStatus(cat){
  return cat.subs.some(s=>VISITED_SENTENCE_SUBS.has(s.id)) ? "opened" : "none";
}

// A finer-grained companion to the visited flag above: exactly which individual sentences
// (by word id — each word has exactly one example sentence) have actually been drawn in
// Random Practice or asked in the Meaning Quiz. This is deliberately just an exposure count,
// not a mastery claim — "seen" isn't "learned." It lets a coverage bar show real gaps (with
// pure random draws, it's entirely possible to hit "next" dozens of times and still never see
// several sentences in a small subcategory by chance), and lets practice nudge toward
// whatever hasn't come up yet instead of re-showing the same handful forever.
const SEEN_SENTENCES_KEY = "seen-sentences-v1";
let SEEN_SENTENCE_IDS = new Set();
async function loadSeenSentences(){
  try{
    let raw = null;
    if(STORAGE_BACKEND === "claude"){
      const res = await window.storage.get(SEEN_SENTENCES_KEY, false);
      if(res && res.value) raw = res.value;
    } else if(STORAGE_BACKEND === "local"){
      raw = localStorage.getItem(SEEN_SENTENCES_KEY);
    } else if(_memoryStore[SEEN_SENTENCES_KEY]){
      raw = _memoryStore[SEEN_SENTENCES_KEY];
    }
    if(raw) SEEN_SENTENCE_IDS = new Set(JSON.parse(raw));
  }catch(e){ /* none yet */ }
}
let seenSentencesSaveTimer = null;
async function saveSeenSentencesNow(){
  const json = JSON.stringify(Array.from(SEEN_SENTENCE_IDS));
  try{
    if(STORAGE_BACKEND === "claude") await window.storage.set(SEEN_SENTENCES_KEY, json, false);
    else if(STORAGE_BACKEND === "local") localStorage.setItem(SEEN_SENTENCES_KEY, json);
    else _memoryStore[SEEN_SENTENCES_KEY] = json;
  }catch(e){ console.warn("Seen-sentences save failed", e); }
}
function markSentenceSeen(wordId){
  if(!wordId || SEEN_SENTENCE_IDS.has(wordId)) return;
  SEEN_SENTENCE_IDS.add(wordId);
  clearTimeout(seenSentencesSaveTimer);
  seenSentencesSaveTimer = setTimeout(saveSeenSentencesNow, 350);
}
function getSentenceCoverage(words){
  const seen = words.filter(w=>SEEN_SENTENCE_IDS.has(w.id)).length;
  return { seen, total: words.length };
}
// Picks a random sentence, but weights toward ones not seen yet — once every sentence in
// the pool has been seen at least once, it falls back to a genuinely uniform random pick.
function pickSentenceWeighted(pool){
  const unseen = pool.filter(w=>!SEEN_SENTENCE_IDS.has(w.id));
  const source = unseen.length > 0 ? unseen : pool;
  return source[Math.floor(Math.random()*source.length)];
}

// Returns {demoted} — demoted=true when a mastered word was just missed and downgraded to "shaky"
// verified=true means the correct answer was objectively checked by the system (multiple
// choice selection, matching pairs, assembled sentence order) — verified=false means it's a
// self-report (Flashcards' "Got it," clicked after already seeing the answer, with no way to
// confirm the person actually knew it beforehand). A word can only be promoted to "mastered"
// on a correct answer that was actually verified — self-reports alone build the streak but
// can't complete it, so pure guessing/rubber-stamping on Flashcards can't fake mastery.
function markResult(word, correct, verified){
  recordActivityToday();
  const id = word.id;
  let p = PROGRESS[id] || {status:"new", seen:0, correct:0, wrong:0, streak:0, lastSeen:null, masteredAt:null, popQuizPending:0};
  p.seen++;
  p.lastSeen = Date.now();
  let demoted = false;
  if(correct){
    p.correct++;
    p.streak++;
    if(p.status==="shaky"){
      p.popQuizPending = Math.max(0, p.popQuizPending-1);
      if(p.popQuizPending===0 && verified){ p.status="mastered"; p.masteredAt=Date.now(); p.streak=0; }
    } else if(p.status!=="mastered"){
      if(p.streak>=MASTERY_STREAK && verified){
        p.status = "mastered";
        p.masteredAt = Date.now();
      } else {
        p.status = "learning";
      }
    }
  } else {
    p.wrong++;
    p.streak=0;
    if(p.status==="mastered"){
      p.status="shaky";
      p.popQuizPending = POPQUIZ_NEEDED;
      demoted = true;
    } else if(p.status==="shaky"){
      p.popQuizPending = POPQUIZ_NEEDED;
    } else {
      p.status = "learning";
    }
  }

  // Spaced-repetition scheduling (simplified SM-2) — runs independently of the
  // mastered/shaky status above, so it isn't affected by that system's own resets.
  p.srsReps = correct ? (p.srsReps||0) + 1 : 0;
  p.easeFactor = p.easeFactor || 2.5;
  if(correct){
    if(p.srsReps === 1) p.interval = 1;
    else if(p.srsReps === 2) p.interval = 6;
    else p.interval = Math.round((p.interval||6) * p.easeFactor);
    p.easeFactor = Math.max(1.3, p.easeFactor + 0.1);
  } else {
    p.interval = 1;
    p.easeFactor = Math.max(1.3, p.easeFactor - 0.2);
  }
  p.nextReview = Date.now() + p.interval*24*60*60*1000;

  PROGRESS[id] = p;
  saveProgress();
  return {demoted, progress:p};
}

function getDueWords(){
  const now = Date.now();
  return allWords().filter(w=>{
    const p = PROGRESS[w.id];
    return p && p.nextReview && p.nextReview <= now;
  });
}

// Marks a word as mastered directly — for words you already know and don't need
// to drill through the normal 4-correct-in-a-row cycle to prove it.
function markWordAsKnown(w){
  const prior = PROGRESS[w.id];
  const p = {
    status: "mastered",
    seen: (prior?.seen || 0) + 1,
    correct: (prior?.correct || 0) + 1,
    wrong: prior?.wrong || 0,
    streak: MASTERY_STREAK,
    lastSeen: Date.now(),
    masteredAt: Date.now(),
    popQuizPending: 0,
    srsReps: 3,
    easeFactor: prior?.easeFactor || 2.5,
    interval: 6,
    nextReview: Date.now() + 6*24*60*60*1000
  };
  PROGRESS[w.id] = p;
  saveProgress();
}
function markSubcategoryAsKnown(sub){
  const alreadyMastered = sub.words.filter(w=>PROGRESS[w.id]?.status==="mastered").length;
  const toMark = sub.words.length - alreadyMastered;
  if(toMark === 0){ showToast(`Every word in "${sub.en}" is already marked mastered.`); return; }
  showConfirm(`Mark all ${sub.words.length} words in "${sub.en}" as already known? This skips practice and marks them mastered immediately — you can always demote one later by getting it wrong in a quiz or flashcard session.`, ()=>{
    sub.words.forEach(w=>markWordAsKnown(w));
    showToast(`Marked ${toMark} word${toMark===1?"":"s"} in "${sub.en}" as known.`);
    activeRerender();
  });
}

// Marks any shaky words already in the deck, and randomly injects a couple more from elsewhere
function annotateAndInjectPopQuizzes(deck){
  deck.forEach(w=>{ const p = PROGRESS[w.id]; if(p && p.status==="shaky") w.isPopQuiz = true; });
  const existingIds = new Set(deck.map(w=>w.id));
  const candidates = Object.keys(PROGRESS).filter(id=> PROGRESS[id].status==="shaky" && WORDS_BY_ID[id] && !existingIds.has(id));
  shuffle(candidates).slice(0,2).forEach(id=>{
    const w = {...WORDS_BY_ID[id], isPopQuiz:true};
    const pos = Math.min(deck.length, Math.floor(Math.random()*deck.length)+1);
    deck.splice(pos, 0, w);
  });
  return deck;
}

function showToast(msg){
  let t = document.getElementById("appToast");
  if(!t){
    t = document.createElement("div");
    t.id = "appToast";
    t.className = "app-toast";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove("show"), 4500);
}

// Native window.confirm() is unreliable inside iOS home-screen PWAs (standalone mode) —
// it can silently fail to appear or get auto-dismissed without the person seeing anything,
// which makes buttons that depend on it look completely broken. This is an in-app
// replacement that renders its own modal and works consistently everywhere.
function showConfirm(message, onConfirm){
  const existing = document.getElementById("confirmOverlay");
  if(existing) existing.remove();
  const overlay = document.createElement("div");
  overlay.id = "confirmOverlay";
  overlay.className = "confirm-overlay";
  overlay.innerHTML = `
    <div class="confirm-modal">
      <div class="confirm-message">${message}</div>
      <div class="confirm-actions">
        <button class="btn" id="confirmCancelBtn">Cancel</button>
        <button class="btn primary" id="confirmOkBtn">Confirm</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const cleanup = ()=>overlay.remove();
  document.getElementById("confirmCancelBtn").addEventListener("click", cleanup);
  document.getElementById("confirmOkBtn").addEventListener("click", ()=>{ cleanup(); onConfirm(); });
  overlay.addEventListener("click", (e)=>{ if(e.target===overlay) cleanup(); });
}

// Lives outside #main so it survives every view change — appended to <body> once at startup.
let timerState = { duration:900, remaining:900, running:false, intervalId:null, panelOpen:false };
let timerAudioCtx = null;
// Must be created/resumed inside a real click handler — browsers block audio
// started from a background setInterval callback otherwise.
function unlockTimerAudio(){
  try{
    if(!timerAudioCtx) timerAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(timerAudioCtx.state === "suspended") timerAudioCtx.resume();
  }catch(e){ /* audio not available */ }
}

function initTimerWidget(){

        </div>

          <label for="timerMinutesInput">min</label>
        </div>

          <input type="number" id="timerSecondsInput" min="0" max="59" placeholder="0">
          <label for="timerSecondsInput">sec</label>
        </div>
        <button class="btn" id="timerCustomSet">Set</button>
      </div>
      <div class="timer-controls">
        <button class="btn primary" id="timerStartPause">Start</button>
        <button class="btn" id="timerReset">Reset</button>
      </div>

    </div>

  `;
  document.body.appendChild(widget);

  document.getElementById("timerFab").addEventListener("click", ()=>{
    unlockTimerAudio(); // first real click on the page for most users — good place to unlock audio early
    timerState.panelOpen = !timerState.panelOpen;
    document.getElementById("timerPanel").style.display = timerState.panelOpen ? "block" : "none";
  });
  document.getElementById("timerPanelClose").addEventListener("click", ()=>{
    timerState.panelOpen = false;
    document.getElementById("timerPanel").style.display = "none";
  });
  document.querySelectorAll(".timer-preset").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      setTimerDuration(parseInt(btn.dataset.min)*60);
      document.querySelectorAll(".timer-preset").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
    });
  });
  document.getElementById("timerCustomSet").addEventListener("click", ()=>{
    const h = parseInt(document.getElementById("timerHoursInput").value) || 0;
    const m = parseInt(document.getElementById("timerMinutesInput").value) || 0;
    const s = parseInt(document.getElementById("timerSecondsInput").value) || 0;
    const total = h*3600 + m*60 + s;
    if(total > 0 && total <= 24*3600){
      setTimerDuration(total);
      document.querySelectorAll(".timer-preset").forEach(b=>b.classList.remove("active"));
    }
  });
  document.getElementById("timerStartPause").addEventListener("click", ()=>{ unlockTimerAudio(); toggleTimer(); });
  document.getElementById("timerReset").addEventListener("click", resetTimer);
  document.getElementById("timerTestSound").addEventListener("click", ()=>{ try{ playAlarmTones(); }catch(e){} if(navigator.vibrate) navigator.vibrate(200); });
  updateTimerDisplay();
}

function setTimerDuration(seconds){
  pauseTimer();
  timerState.duration = seconds;
  timerState.remaining = seconds;
  updateTimerDisplay();
}
function toggleTimer(){ timerState.running ? pauseTimer() : startTimer(); }
function startTimer(){
  if(timerState.remaining <= 0) timerState.remaining = timerState.duration;
  timerState.running = true;
  const btn = document.getElementById("timerStartPause");
  if(btn) btn.textContent = "Pause";
  const fab = document.getElementById("timerFab");
  if(fab) fab.classList.add("running");
  clearInterval(timerState.intervalId);
  timerState.intervalId = setInterval(()=>{
    timerState.remaining--;
    updateTimerDisplay();
    if(timerState.remaining <= 0){
      timerRingAlert();
      pauseTimer();
    }
  }, 1000);
}
function pauseTimer(){
  timerState.running = false;
  clearInterval(timerState.intervalId);
  const btn = document.getElementById("timerStartPause");
  if(btn) btn.textContent = "Start";
  const fab = document.getElementById("timerFab");
  if(fab) fab.classList.remove("running");
}
function resetTimer(){
  pauseTimer();
  timerState.remaining = timerState.duration;
  updateTimerDisplay();
}
function updateTimerDisplay(){
  const h = Math.floor(timerState.remaining/3600);
  const m = Math.floor((timerState.remaining%3600)/60);
  const s = timerState.remaining%60;
  const text = h>0
    ? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`
    : `${m}:${String(s).padStart(2,"0")}`;
  const display = document.getElementById("timerDisplay");
  if(display) display.textContent = text;
  const fab = document.getElementById("timerFab");
  if(fab) fab.textContent = (timerState.running || timerState.remaining !== timerState.duration) ? text : "⏱️";
}
function playAlarmTones(){
  unlockTimerAudio();
  const ctx = timerAudioCtx;
  if(!ctx) return;
  const playTone = (delay, freq, dur)=>{
    setTimeout(()=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime+0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+dur);
      osc.start();
      osc.stop(ctx.currentTime + dur + 0.05);
    }, delay);
  };
  const hi = 988, lo = 740, toneDur = 0.28, gap = 340;
  for(let rep=0; rep<4; rep++){
    playTone(rep*gap*2, hi, toneDur);
    playTone(rep*gap*2 + gap, lo, toneDur);
  }
}
function timerRingAlert(){
  try{ playAlarmTones(); }catch(e){ /* audio not available */ }
  if(navigator.vibrate) navigator.vibrate([200,100,200,100,200,100,200]);
  const mins = Math.round(timerState.duration/60);
  showToast(`⏰ Time's up! You practiced for ${mins} minute${mins===1?"":"s"}.`);
  const fab = document.getElementById("timerFab");
  if(fab){
    fab.classList.add("ringing");
    setTimeout(()=>fab.classList.remove("ringing"), 4000);
  }
  timerState.panelOpen = true;
  const panel = document.getElementById("timerPanel");
  if(panel) panel.style.display = "block";
}

function timeAgo(ts){
  if(!ts) return "—";
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return "just now";
  if(s<3600) return Math.floor(s/60)+"m ago";
  if(s<86400) return Math.floor(s/3600)+"h ago";
  return Math.floor(s/86400)+"d ago";
}

function renderContinueCard(){
  const wrap = document.getElementById("continueWrap");
  if(!wrap) return;
  if(!LAST_ACTIVITY){ wrap.innerHTML = ""; return; }
  const cat = DATA.categories.find(c=>c.id===LAST_ACTIVITY.catId);
  const sub = cat && cat.subs.find(s=>s.id===LAST_ACTIVITY.subId);
  if(!cat || !sub){ wrap.innerHTML = ""; return; }
  const meta = ACTIVITY_LABELS[LAST_ACTIVITY.mode] || {icon:"📍", label:"Practice"};
  wrap.innerHTML = `
    <div class="continue-banner">
      <div>
        <div class="continue-title">${meta.icon} Continue where you left off</div>
        <div class="continue-sub">${meta.label} — ${cat.en} — ${sub.en}</div>
      </div>
      <button class="btn primary" id="continueBtn">Resume →</button>
    </div>
  `;
  document.getElementById("continueBtn").addEventListener("click", resumeLastActivity);
}

// A one-time "welcome back" popup shown on app open (not on every navigation) when there's
// a saved last activity — this is in addition to, not instead of, the always-visible
// continue-banner on the home page itself.
function showWelcomeBackPopup(){
  if(!LAST_ACTIVITY) return;
  const cat = DATA.categories.find(c=>c.id===LAST_ACTIVITY.catId);
  const sub = cat && cat.subs.find(s=>s.id===LAST_ACTIVITY.subId);
  if(!cat || !sub) return;
  const meta = ACTIVITY_LABELS[LAST_ACTIVITY.mode] || {icon:"📍", label:"Practice"};
  const overlay = document.createElement("div");
  overlay.id = "welcomeBackOverlay";
  overlay.className = "confirm-overlay";
  overlay.innerHTML = `
    <div class="confirm-modal welcome-back-modal">
      <div class="welcome-back-icon">${meta.icon}</div>
      <div class="welcome-back-title">Welcome back!</div>
      <div class="confirm-message" style="text-align:center;">Pick up where you left off?<br><strong>${meta.label} — ${cat.en} — ${sub.en}</strong></div>
      <div class="confirm-actions" style="justify-content:center;">
        <button class="btn" id="welcomeBackDismiss">Not now</button>
        <button class="btn primary" id="welcomeBackResume">Resume →</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const cleanup = ()=>overlay.remove();
  document.getElementById("welcomeBackDismiss").addEventListener("click", cleanup);
  document.getElementById("welcomeBackResume").addEventListener("click", ()=>{ cleanup(); resumeLastActivity(); });
  overlay.addEventListener("click", (e)=>{ if(e.target===overlay) cleanup(); });
}

function renderDueToday(){
  const wrap = document.getElementById("dueTodayWrap");
  if(!wrap) return;
  const due = getDueWords();
  if(due.length === 0){ wrap.innerHTML = ""; return; }
  wrap.innerHTML = `
    <div class="due-today-banner">
      <div>
        <div class="due-today-title">📅 ${due.length} word${due.length===1?"":"s"} due for review today</div>
        <div class="due-today-sub">Spaced-repetition scheduling — these are timed to come back right when you're about to forget them.</div>
      </div>
      <button class="btn primary" id="dueTodayBtn">Review now</button>
    </div>
  `;
  document.getElementById("dueTodayBtn").addEventListener("click", ()=>startFlashcardsSession(shuffle(due).slice(0,30), "Due Today"));
}

function renderProgressBar(){
  const wrap = document.getElementById("progressWrap");
  if(!wrap) return;
  const words = wordsForDifficulty(selectedDifficulty);
  const counts = {new:0, learning:0, shaky:0, mastered:0};
  words.forEach(w=>{
    const p = PROGRESS[w.id];
    const status = p ? p.status : "new";
    counts[status] = (counts[status]||0)+1;
  });
  const total = words.length || 1;
  const pct = Math.round((counts.mastered/total)*100);
  wrap.innerHTML = `
    <div class="progress-header">
      <span>Your progress — ${DIFF_META[selectedDifficulty].label}</span>
      <span class="progress-pct">${counts.mastered} / ${words.length} mastered (${pct}%)</span>
    </div>
    <div class="progress-track">
      <div class="progress-seg mastered" style="width:${counts.mastered/total*100}%"></div>
      <div class="progress-seg shaky" style="width:${counts.shaky/total*100}%"></div>
      <div class="progress-seg learning" style="width:${counts.learning/total*100}%"></div>
    </div>
    <div class="progress-legend">
      <span><span class="dot mastered"></span>Mastered — ${counts.mastered}</span>
      <span><span class="dot shaky"></span>Needs retest — ${counts.shaky}</span>
      <span><span class="dot learning"></span>Learning — ${counts.learning}</span>
      <span><span class="dot new"></span>Not started — ${counts.new}</span>
    </div>
    ${!PERSISTENCE_AVAILABLE ? '<div class="mnemonic" style="margin-top:10px;">⚠️ Progress won\'t be saved between visits in this environment.</div>' : ""}
  `;
}

function renderDiffBar(){
  const bar = document.getElementById("diffBar");
  const order = ["easy","medium","hard","expert","mixed"];
  bar.innerHTML = order.map(d=>`
    <button class="diff-pill ${d} ${selectedDifficulty===d?"active":""}" data-diff="${d}">
      <span class="dot"></span>${DIFF_META[d].label}
    </button>
  `).join("");
  bar.querySelectorAll(".diff-pill").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      selectedDifficulty = btn.dataset.diff;
      renderDiffBar();
      renderQuickActions();
      renderCatGrid();
      renderProgressBar();
    });
  });
  document.getElementById("diffDesc").textContent = DIFF_META[selectedDifficulty].desc;
}

function renderQuickActions(){
  const wrap = document.getElementById("quickActions");
  const words = wordsForDifficulty(selectedDifficulty);
  const label = DIFF_META[selectedDifficulty].label;
  wrap.innerHTML = `
    <button class="btn primary" id="quickFlash">🎲 Quick Flashcards — ${label} (${words.length} words)</button>
    <button class="btn teal" id="quickQuiz">📝 Quick Quiz — ${label}</button>
  `;
  document.getElementById("quickFlash").addEventListener("click", ()=>{
    const pool = shuffle(words).slice(0, Math.min(30, words.length));
    startFlashcardsSession(pool, `${label} Practice`);
  });
  document.getElementById("quickQuiz").addEventListener("click", ()=>{
    const pool = shuffle(words).slice(0, Math.min(20, words.length));
    startQuizSession(pool, `${label} Practice`);
  });
}

function renderCatGrid(){
  const grid = document.getElementById("catGrid");
  const label = document.getElementById("catSectionLabel");
  const cats = selectedDifficulty==="mixed" ? DATA.categories : DATA.categories.filter(c=>c.diff===selectedDifficulty);
  label.textContent = selectedDifficulty==="mixed" ? "Browse by category" : `Browse ${DIFF_META[selectedDifficulty].label} categories`;
  grid.innerHTML = "";
  cats.forEach(c=>{
    const count = c.subs.reduce((s,sub)=>s+sub.words.length,0);
    const status = getCatStatus(c);
    const card = document.createElement("div");
    card.className="cat-card" + (status!=="none" ? " status-"+status : "");
    card.innerHTML = `
      ${statusBadgeHtml(status)}
      <span class="icon">${c.icon}</span>
      <span class="name-ar">${displayArName(c)}</span>
      <span class="name-en">${c.en}</span>
      <div class="count">${count} words · ${c.subs.length} subcategories</div>
      <span class="diff-badge ${c.diff}">${DIFF_META[c.diff].label}</span>
    `;
    card.addEventListener("click", ()=>setView("category", c.id));
    grid.appendChild(card);
  });
}

function startHeroFlash(){
  clearInterval(window._heroTimer);
  window._heroTimer = setInterval(()=>{
    const el = document.getElementById("heroFlash");
    const elEn = document.getElementById("heroFlashEn");
    if(!el) { clearInterval(window._heroTimer); return; }
    el.style.opacity = 0;
    elEn.style.opacity = 0;
    setTimeout(()=>{
      heroIdx = (heroIdx+1) % heroWords.length;
      const w = heroWords[heroIdx];
      el.textContent = displayWord(w);
      elEn.textContent = `${w.t} — ${w.e}`;
      el.style.opacity = 1;
      elEn.style.opacity = 1;
    }, 400);
  }, 2600);
}

        <div class="grammar-term">
          <div class="term-name">Root (الجذر)</div>

        </div>
        <div class="grammar-term">
          <div class="term-name">Stem</div>
          <div class="term-desc">The root once it's been given a specific vowel pattern for a tense. Same three letters, different "flavor" depending on past vs. present.<br><span class="grammar-example">كَتَبَ</span> <span style="color:var(--text-muted); font-size:12px;">vs</span> <span class="grammar-example">يَكْتُبُ</span></div>
        </div>
        <div class="grammar-term">
          <div class="term-name">Prefix</div>
          <div class="term-desc">Letters glued onto the <em>front</em> of the stem. In present-tense verbs, the prefix tells you <em>who</em> is doing the action.<br><span class="grammar-example">أَ</span> = I&nbsp;&nbsp;<span class="grammar-example">تَ</span> = you/she&nbsp;&nbsp;<span class="grammar-example">يَ</span> = he/they</div>

          <div class="term-desc">Letters glued onto the <em>end</em> of the stem. In past-tense verbs, the suffix alone tells you who — no prefix needed.<br><span class="grammar-example">ـتُ</span> = I&nbsp;&nbsp;<span class="grammar-example">ـتَ</span> = you (m.)&nbsp;&nbsp;<span class="grammar-example">ـوا</span> = they (m.)</div>

      <div class="grammar-why">

      </div>
    </div>

    <div class="grammar-explainer">
      <h3>🚻 How to tell masculine from feminine</h3>
      <p class="alpha-intro" style="margin-bottom:0;">This isn't just about pronouns (أنتَ vs. أنتِ) — every noun and adjective in Arabic has a gender, and one letter does most of the work.</p>

        <div class="grammar-term">
          <div class="term-name">Nouns — look for ة</div>

        </div>
        <div class="grammar-term">
          <div class="term-name">The exceptions to know</div>

        </div>

          <div class="term-name">4. Hamzated</div>

        <div class="grammar-term">
          <div class="term-name">Past tense: listen for ـتْ</div>
