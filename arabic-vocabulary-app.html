/* ============================= FLASHCARDS ============================= */
let fcState = {};

function startFlashcards(catId, subId){
  const cat = DATA.categories.find(c=>c.id===catId);
  const sub = cat.subs.find(s=>s.id===subId);
  const deck = annotateAndInjectPopQuizzes(shuffle(sub.words));
  fcState = { cat, sub, label: sub.en, sourceWords: sub.words, deck, total: deck.length, i:0, known:0, history:[], flipped:false };
  recordLastActivity("flashcards", catId, subId);
  renderFlashcard();
}
function startFlashcardsSession(words, label){
  const deck = annotateAndInjectPopQuizzes(shuffle(words));
  fcState = { cat:null, sub:null, label, sourceWords: words, deck, total: deck.length, i:0, known:0, history:[], flipped:false };
  renderFlashcard();
}

function crumbHtml(fs, suffix){
  return fs.cat
    ? `<a data-nav="home">Categories</a> <span>›</span> <a data-nav="cat">${fs.cat.en}</a> <span>›</span> <span>${fs.sub.en}${suffix||""}</span>`
    : `<a data-nav="home">Categories</a> <span>›</span> <span>${fs.label}${suffix||""}</span>`;
}

// Snapshots the word's progress state before marking it, so "Back" can fully undo the mark —
// not just visually go back, but actually restore the mastery/streak data too.
function pushFcHistory(w){
  fcState.history.push({
    index: fcState.i,
    wordId: w.id,
    progressBefore: PROGRESS[w.id] ? JSON.parse(JSON.stringify(PROGRESS[w.id])) : null,
    knownBefore: fcState.known
  });
}
function undoLastFcAnswer(){
  const entry = fcState.history.pop();
  if(!entry) return false;
  fcState.i = entry.index;
  fcState.known = entry.knownBefore;
  fcState.flipped = false;
  if(entry.progressBefore === null) delete PROGRESS[entry.wordId];
  else PROGRESS[entry.wordId] = entry.progressBefore;
  saveProgress();
  return true;
}

function renderFlashcard(){
  activeRerender = renderFlashcard;
  if(fcState.i >= fcState.deck.length){
    main.innerHTML = `
      <div class="crumbs">${crumbHtml(fcState)}</div>
      <div class="fc-done">
        <div style="font-size:44px;">🎉</div>
        <div class="big">Deck complete!</div>
        <p style="color:var(--text-muted);">You reviewed ${fcState.deck.length} words · ${fcState.known} marked as known.</p>
        <div class="fc-controls" style="margin-top:20px;">
          ${fcState.history.length>0 ? '<button class="btn" id="fcBackOne">← Back to last card</button>' : ""}
          <button class="btn primary" id="fcAgain">Practice again</button>
          <button class="btn teal" id="fcQuiz">Take the quiz</button>
          <button class="btn" id="fcBack">${fcState.cat ? "Back to subcategories" : "Back to categories"}</button>
        </div>
      </div>
    `;
    bindCrumbs();
    const backOne = document.getElementById("fcBackOne");
    if(backOne) backOne.addEventListener("click", ()=>{ undoLastFcAnswer(); renderFlashcard(); });
    document.getElementById("fcAgain").addEventListener("click", ()=>{
      if(fcState.cat) startFlashcards(fcState.cat.id, fcState.sub.id);
      else startFlashcardsSession(fcState.sourceWords, fcState.label);
    });
    document.getElementById("fcQuiz").addEventListener("click", ()=>{
      if(fcState.cat) startQuiz(fcState.cat.id, fcState.sub.id);
      else startQuizSession(fcState.sourceWords, fcState.label);
    });
    document.getElementById("fcBack").addEventListener("click", ()=>{
      if(fcState.cat) renderCategory(fcState.cat.id);
      else setView("home");
    });
    return;
  }
  const w = fcState.deck[fcState.i];
  const total = fcState.total || fcState.deck.length;
  const pct = Math.min(100, Math.round((fcState.i/total)*100));
  const cardLabel = (fcState.i+1) <= total
    ? `Card ${fcState.i+1} of ${total}`
    : `Reviewing missed words (${fcState.deck.length - fcState.i} left)`;
  main.innerHTML = `
    <div class="crumbs">${crumbHtml(fcState, " — Flashcards")}</div>
    <div class="fc-wrap">
      <div class="fc-progress"><div class="fc-progress-bar" style="width:${pct}%"></div></div>
      <div class="practice-top-row">
        <div class="fc-meta">${cardLabel}</div>
        <button class="exit-btn" id="fcExitBtn" title="Exit to subcategories">✕ Exit</button>
      </div>
      ${w.isPopQuiz ? '<div class="popquiz-badge">🔔 Pop quiz — you marked this mastered before</div>' : ""}
      <div class="card${fcState.flipped ? " flipped" : ""}" id="fcCard">
        <div class="card-inner">
          <div class="card-face card-front">
            <div class="card-word">${displayWord(w)}</div>
            <div class="card-pos">${w.p||''}</div>
            <button class="speak-btn card-speak-btn" id="fcSpeakBtn" title="Listen">🔊</button>
            <div class="card-hint">Tap to reveal meaning</div>
            ${showTashkeel && !w.tk ? '<div class="card-hint" style="color:var(--danger); margin-top:2px;">⚠️ Diacritics not added yet for this word</div>' : ""}
          </div>
          <div class="card-face card-back">
            <div class="card-en">${w.e}</div>
            <div class="card-translit">${w.t}</div>
            <div class="card-ex"><span class="ar">${w.s}</span>${w.x}</div>
          </div>
        </div>
      </div>
      <div class="fc-controls">
        ${fcState.history.length>0 ? '<button class="btn back-btn" id="fcBackBtn">← Back</button>' : ""}
        <button class="btn again" id="fcAgainBtn">↺ Still learning</button>
        <button class="btn know" id="fcKnowBtn">✓ Got it</button>
      </div>
      <button class="already-know-btn" id="fcAlreadyKnowBtn">⭐ I already know this — skip straight to mastered</button>
    </div>
  `;
  bindCrumbs();
  document.getElementById("fcAlreadyKnowBtn").addEventListener("click", (e)=>{
    e.stopPropagation();
    pushFcHistory(w);
    markWordAsKnown(w);
    fcState.known++; fcState.i++; fcState.flipped = false; renderFlashcard();
  });
  document.getElementById("fcExitBtn").addEventListener("click", ()=>{
    if(fcState.cat) renderCategory(fcState.cat.id);
    else setView("home");
  });
  const cardEl = document.getElementById("fcCard");
  cardEl.addEventListener("click", ()=>{ fcState.flipped = !fcState.flipped; cardEl.classList.toggle("flipped"); });
  document.getElementById("fcSpeakBtn").addEventListener("click", (e)=>{ e.stopPropagation(); speak(w.tk || w.a); });
  const backBtn = document.getElementById("fcBackBtn");
  if(backBtn) backBtn.addEventListener("click", (e)=>{
    e.stopPropagation();
    if(undoLastFcAnswer()) renderFlashcard();
  });
  document.getElementById("fcKnowBtn").addEventListener("click", (e)=>{
    e.stopPropagation();
    pushFcHistory(w);
    markResult(w, true, false);
    const p = PROGRESS[w.id];
    if(p.status==="learning" && p.streak>=MASTERY_STREAK){
      showToast(`"${w.e}" — you've gotten this right ${p.streak} times in Flashcards, but it needs one correct answer in a Quiz to actually confirm mastery. Flashcards is self-reported, so it can't fully verify recall on its own.`);
    }
    fcState.known++; fcState.i++; fcState.flipped = false; renderFlashcard();
  });
  document.getElementById("fcAgainBtn").addEventListener("click", (e)=>{
    e.stopPropagation();
    pushFcHistory(w);
    const {demoted} = markResult(w, false, false);
    fcState.deck.push(w);
    if(demoted){
      fcState.deck.splice(Math.min(fcState.deck.length, fcState.i+3), 0, w);
      showToast(`"${w.e}" was mastered but you missed it — it'll come back a couple more times this session, and may pop up in future practice too.`);
    }
    fcState.i++; fcState.flipped = false; renderFlashcard();
  });
}

function bindCrumbs(){
  const home = main.querySelector('[data-nav="home"]');
  if(home) home.addEventListener("click", ()=>setView("home"));
  const cat = main.querySelector('[data-nav="cat"]');
  if(cat) cat.addEventListener("click", ()=>{ const fs = fcState.cat ? fcState : qzState; renderCategory(fs.cat.id); });
}

/* ============================= QUIZ ============================= */
let qzState = {};

/* ============================= QUIZ STOPWATCH ============================= */
// A simple elapsed-time display shown during any quiz session (word quiz, sentence
// quiz). Purely informational — doesn't affect scoring, just gives a sense of pace.
let quizTimerInterval = null;
let quizTimerStart = null;
function startQuizStopwatch(){
  stopQuizStopwatch();
  quizTimerStart = Date.now();
  quizTimerInterval = setInterval(updateQuizStopwatchDisplay, 1000);
  updateQuizStopwatchDisplay();
}
function stopQuizStopwatch(){
  clearInterval(quizTimerInterval);
  quizTimerInterval = null;
}
function updateQuizStopwatchDisplay(){
  const el = document.getElementById("quizStopwatch");
  if(!el){ return; } // element just isn't on screen right now (e.g. done screen) — keep ticking, don't stop
  const elapsed = Math.floor((Date.now()-quizTimerStart)/1000);
  const m = Math.floor(elapsed/60);
  const s = elapsed%60;
  el.textContent = `⏱️ ${m}:${String(s).padStart(2,"0")}`;
}

function startQuiz(catId, subId){
  const cat = DATA.categories.find(c=>c.id===catId);
  const sub = cat.subs.find(s=>s.id===subId);
  qzState = { cat, sub, label: sub.en, sourceWords: sub.words, deck: annotateAndInjectPopQuizzes(shuffle(sub.words)), i:0, score:0, answered:false, history:[], currentIndex:-1 };
  recordLastActivity("quiz", catId, subId);
  startQuizStopwatch();
  renderQuiz();
}
function startQuizSession(words, label){
  qzState = { cat:null, sub:null, label, sourceWords: words, deck: annotateAndInjectPopQuizzes(shuffle(words)), i:0, score:0, answered:false, history:[], currentIndex:-1 };
  startQuizStopwatch();
  renderQuiz();
}

function buildOptions(correctWord, pool){
  const others = pool.filter(w=>w.e!==correctWord.e);
  const distractors = shuffle(others).slice(0,3).map(w=>w.e);
  return shuffle([correctWord.e, ...distractors]);
}
function buildOptionsReverse(correctWord, pool){
  const others = pool.filter(w=>w.a!==correctWord.a);
  const distractors = shuffle(others).slice(0,3).map(w=>displayWord(w));
  return shuffle([displayWord(correctWord), ...distractors]);
}

function pushQzHistory(w){
  qzState.history.push({
    index: qzState.i,
    wordId: w.id,
    progressBefore: PROGRESS[w.id] ? JSON.parse(JSON.stringify(PROGRESS[w.id])) : null,
    scoreBefore: qzState.score
  });
}
function undoLastQzAnswer(){
  const entry = qzState.history.pop();
  if(!entry) return false;
  qzState.i = entry.index;
  qzState.score = entry.scoreBefore;
  qzState.answered = false;
  if(entry.progressBefore === null) delete PROGRESS[entry.wordId];
  else PROGRESS[entry.wordId] = entry.progressBefore;
  saveProgress();
  return true;
}

function renderQuiz(){
  activeRerender = renderQuiz;
  if(qzState.i >= qzState.deck.length){
    stopQuizStopwatch();
    const finalElapsed = quizTimerStart ? Math.floor((Date.now()-quizTimerStart)/1000) : 0;
    const fm = Math.floor(finalElapsed/60), fs = finalElapsed%60;
    main.innerHTML = `
      <div class="crumbs">${crumbHtml(qzState)}</div>
      <div class="fc-done">
        <div style="font-size:44px;">🏁</div>
        <div class="big">Score: ${qzState.score} / ${qzState.deck.length}</div>
        <p style="color:var(--text-muted);">⏱️ Finished in ${fm}:${String(fs).padStart(2,"0")}</p>
        <div class="fc-controls" style="margin-top:20px;">
          ${qzState.history.length>0 ? '<button class="btn back-btn" id="qzBackOne">← Back to last question</button>' : ""}
          <button class="btn primary" id="qzAgain">Try again</button>
          <button class="btn teal" id="qzFlash">Review with flashcards</button>
          <button class="btn" id="qzBack">${qzState.cat ? "Back to subcategories" : "Back to categories"}</button>
        </div>
      </div>
    `;
    bindCrumbs();
    const backOne = document.getElementById("qzBackOne");
    if(backOne) backOne.addEventListener("click", ()=>{ undoLastQzAnswer(); startQuizStopwatch(); renderQuiz(); });
    document.getElementById("qzAgain").addEventListener("click", ()=>{
      if(qzState.cat) startQuiz(qzState.cat.id, qzState.sub.id);
      else startQuizSession(qzState.sourceWords, qzState.label);
    });
    document.getElementById("qzFlash").addEventListener("click", ()=>{
      if(qzState.cat) startFlashcards(qzState.cat.id, qzState.sub.id);
      else startFlashcardsSession(qzState.sourceWords, qzState.label);
    });
    document.getElementById("qzBack").addEventListener("click", ()=>{
      if(qzState.cat) renderCategory(qzState.cat.id);
      else setView("home");
    });
    return;
  }
  const w = qzState.deck[qzState.i];
  const pool = qzState.cat
    ? (allWordsFromWholeCategory(qzState.cat).length > 6 ? allWordsFromWholeCategory(qzState.cat) : allWords())
    : allWords();
  // Only pick a new direction/option set when this is genuinely a new question —
  // re-renders of the SAME question (e.g. toggling tashkeel mid-question) must reuse
  // what's already showing, or an answered question would silently reset.
  const isNewQuestion = qzState.currentIndex !== qzState.i;
  if(isNewQuestion){
    qzState.currentIndex = qzState.i;
    qzState.currentDirection = Math.random() < 0.5 ? "ar2en" : "en2ar";
    qzState.currentOptions = qzState.currentDirection==="ar2en"
      ? buildOptions(w, pool.filter(x=>x.a!==w.a).concat([w]))
      : buildOptionsReverse(w, pool.filter(x=>x.a!==w.a).concat([w]));
    qzState.selectedText = null;
  }
  const direction = qzState.currentDirection;
  const options = qzState.currentOptions;
  const correctText = direction==="ar2en" ? w.e : displayWord(w);
  const promptHtml = direction==="ar2en"
    ? `<div class="quiz-word">${displayWord(w)}<button class="speak-btn quiz-speak-btn" id="quizSpeakBtn" title="Listen">🔊</button></div>
       <div class="quiz-translit">${w.t}</div>`
    : `<div class="quiz-direction-label">Choose the Arabic word for:</div>
       <div class="quiz-word quiz-word-en">${w.e}</div>`;
  main.innerHTML = `
    <div class="crumbs">${crumbHtml(qzState, " — Quiz")}</div>
    <div class="quiz-wrap">
      <div class="quiz-top-row">
        <div class="quiz-score">Question ${qzState.i+1} of ${qzState.deck.length} · Score ${qzState.score} · <span id="quizStopwatch">⏱️ 0:00</span></div>
        <div class="quiz-top-actions">
          ${qzState.history.length>0 ? '<button class="btn back-btn quiz-back-btn" id="qzBackBtn">← Back</button>' : ""}
          <button class="exit-btn" id="qzExitBtn" title="Exit to subcategories">✕ Exit</button>
        </div>
      </div>
      ${w.isPopQuiz ? '<div class="popquiz-badge">🔔 Pop quiz — you marked this mastered before</div>' : ""}
      ${promptHtml}
      <div class="quiz-options" id="quizOptions"></div>
      <div class="quiz-next" id="quizNextWrap" style="display:${qzState.answered ? "block" : "none"};"><button class="btn primary" id="quizNext">Next →</button></div>
    </div>
  `;
  bindCrumbs();
  updateQuizStopwatchDisplay();
  const qzBackBtn = document.getElementById("qzBackBtn");
  if(qzBackBtn) qzBackBtn.addEventListener("click", ()=>{ if(undoLastQzAnswer()) renderQuiz(); });
  document.getElementById("qzExitBtn").addEventListener("click", ()=>{
    stopQuizStopwatch();
    if(qzState.cat) renderCategory(qzState.cat.id);
    else setView("home");
  });
  const speakBtn = document.getElementById("quizSpeakBtn");
  if(speakBtn) speakBtn.addEventListener("click", (e)=>{ e.stopPropagation(); speak(w.tk || w.a); });
  const optWrap = document.getElementById("quizOptions");
  options.forEach(optText=>{
    const btn = document.createElement("div");
    btn.className="quiz-opt" + (direction==="en2ar" ? " quiz-opt-ar" : "");
    btn.textContent = optText;
    // Restore the answered state on re-render (e.g. after toggling tashkeel) instead of losing it
    if(qzState.answered){
      btn.classList.add("disabled");
      if(optText === correctText) btn.classList.add("correct");
      else if(optText === qzState.selectedText) btn.classList.add("wrong");
    }
    btn.addEventListener("click", ()=>{
      if(qzState.answered) return;
      qzState.answered = true;
      qzState.selectedText = optText;
      pushQzHistory(w);
      const correct = optText === correctText;
      if(correct) qzState.score++;
      const {demoted} = markResult(w, correct, true);
      if(demoted){
        qzState.deck.splice(Math.min(qzState.deck.length, qzState.i+2), 0, w);
        qzState.deck.splice(Math.min(qzState.deck.length, qzState.i+5), 0, w);
        showToast(`"${w.e}" was mastered but you missed it — you'll see it again shortly, and it may pop up in future practice too.`);
      }
      document.querySelectorAll(".quiz-opt").forEach(o=>{
        o.classList.add("disabled");
        if(o.textContent === correctText) o.classList.add("correct");
        else if(o===btn) o.classList.add("wrong");
      });
      if(direction==="en2ar"){
        const correctEl = optWrap.querySelector(".quiz-opt.correct");
        if(correctEl && !correctEl.querySelector(".speak-btn")){
          const sb = document.createElement("button");
          sb.className = "speak-btn"; sb.style.marginLeft="8px"; sb.textContent = "🔊";
          sb.addEventListener("click", (e)=>{ e.stopPropagation(); speak(w.tk || w.a); });
          correctEl.appendChild(sb);
        }
      }
      document.getElementById("quizNextWrap").style.display="block";
    });
    optWrap.appendChild(btn);
  });
  // Restore the speak-icon on the correct answer for en2ar questions when re-rendering an already-answered state
  if(qzState.answered && direction==="en2ar"){
    const correctEl = optWrap.querySelector(".quiz-opt.correct");
    if(correctEl && !correctEl.querySelector(".speak-btn")){
      const sb = document.createElement("button");
      sb.className = "speak-btn"; sb.style.marginLeft="8px"; sb.textContent = "🔊";
      sb.addEventListener("click", (e)=>{ e.stopPropagation(); speak(w.tk || w.a); });
      correctEl.appendChild(sb);
    }
  }
  document.getElementById("quizNext").addEventListener("click", ()=>{ qzState.i++; qzState.answered=false; renderQuiz(); });
}
function allWordsFromWholeCategory(cat){
  const out=[];
  cat.subs.forEach(s=>s.words.forEach(w=>out.push(w)));
  return out;
}

  document.getElementById("mgExitBtn").addEventListener("click", ()=>{
    stopMatchStopwatch();
    if(mgState.catId) renderCategory(mgState.catId);

  });

    document.getElementById("mgBack").addEventListener("click", ()=>{
      if(mgState.catId) renderCategory(mgState.catId);
      else setView("home");
    });
    return;
  }
  const grid = document.getElementById("matchGrid");
  mgState.tiles.forEach((tile, idx)=>{

    const btn = document.createElement("button");
    btn.className = "match-tile"

function handleMatchTileClick(idx){
  if(mgState.selected.includes(idx) || mgState.selected.length >= 2) return;
  mgState.selected.push(idx);
  if(mgState.selected.length < 2){ renderMatchingGame(); return; }
  const [i1, i2] = mgState.selected;
  const t1 = mgState.tiles[i1], t2 = mgState.tiles[i2];
  if(t1.id === t2.id && t1.side !== t2.side){
    mgState.matchedIds.add(t1.id);
    mgState.selected = [];
    if(mgState.matchedIds.size === mgState.words.length){
      mgState.done = true;
      mgState.elapsed = Math.floor((Date.now()-mgState.startTime)/1000);
      stopMatchStopwatch();
    }
    renderMatchingGame();
  } else {
    mgState.mistakes++;
    mgState.wrongFlashIds = new Set([i1, i2]);
    renderMatchingGame();
    setTimeout(()=>{
      mgState.selected = [];
      mgState.wrongFlashIds = new Set();
      renderMatchingGame();
    }, 700);
  }
}

/* ============================= TASHKEEL CHALLENGE ============================= */
// Unique to this app: undiacritized Arabic is what learners actually encounter in the
// real world — this drills the specific skill of supplying the right vowel pattern.
let tcState = {};
// Splits a tashkeel-marked string into {base, marks} pairs, one per Arabic letter,
// so we can identify and scramble just the short-vowel positions.
function tokenizeTashkeel(tk){
  const tokens = [];
  const chars = Array.from(tk);
  let i = 0;
  while(i < chars.length){
    const base = chars[i];
    i++;
    let marks = "";
    while(i < chars.length && /[\u064B-\u0652\u0670]/.test(chars[i])){
      marks += chars[i];
      i++;
    }
    tokens.push({base, marks});
  }
  return tokens;
}
const SHORT_VOWEL_MARKS = ["\u064E","\u0650","\u064F","\u0652"]; // fatha, kasra, damma, sukun
// Produces a plausible-looking WRONG vowelization of the same word — same letters,
// same positions, just the wrong short vowel at one or more spots. Shadda/tanwin/long
// vowels are left untouched so the result never looks broken, just incorrectly vowelled.
function generateWrongTashkeelVariant(tk){
  const tokens = tokenizeTashkeel(tk);
  const swappable = [];
  tokens.forEach((tok, idx)=>{ if(SHORT_VOWEL_MARKS.includes(tok.marks)) swappable.push(idx); });
  if(swappable.length === 0) return null;
  const result = tokens.map(t=>({...t}));
  swappable.forEach(idx=>{
    const current = result[idx].marks;
    const choices = SHORT_VOWEL_MARKS.filter(v=>v!==current);
    result[idx].marks = choices[Math.floor(Math.random()*choices.length)];
  });
  return result.map(t=>t.base+t.marks).join("");
}
function generateWrongTashkeelOptions(tk, count){
  const variants = new Set();
  let attempts = 0;
  while(variants.size < count && attempts < 40){
    attempts++;
    const v = generateWrongTashkeelVariant(tk);
    if(v && v !== tk) variants.add(v);
  }
  return Array.from(variants);
}

function startTashkeelChallenge(words, label, catId, subId){
  const pool = words.filter(w=>w.tk);
  if(pool.length < 4){
    showToast("Not enough tashkeel-marked words in this set yet for a challenge round.");
    return;
  }
  tcState = { pool, label, catId, subId, score:0, asked:0, current:null, options:null, answered:false };
  recordLastActivity("tashkeel", catId, subId);
  startQuizStopwatch();
  nextTashkeelQuestion();
}
function nextTashkeelQuestion(){
  tcState.current = tcState.pool[Math.floor(Math.random()*tcState.pool.length)];
  let wrongVariants = generateWrongTashkeelOptions(tcState.current.tk, 3);
  // Fallback for the rare word too short to scramble (e.g. only one swappable vowel) —
  // pad out with other real words' correct forms so the question never breaks.
  if(wrongVariants.length < 3){
    const others = tcState.pool.filter(w=>w.tk !== tcState.current.tk && !wrongVariants.includes(w.tk));
    const padding = shuffle(others).slice(0, 3-wrongVariants.length).map(w=>w.tk);
    wrongVariants = wrongVariants.concat(padding);
  }
  tcState.options = shuffle([tcState.current.tk, ...wrongVariants]);
  tcState.answered = false;
  tcState.asked++;
  renderTashkeelChallenge();
}
function crumbHtmlForTashkeel(s){
  if(!s.catId) return `<a data-nav="home">Categories</a> <span>›</span> <span>Tashkeel Challenge — ${s.label}</span>`;

// A speed round themed around the zellige tilework pattern already used as this app's
// visual identity — each correct answer completes one tile of a growing mosaic before
// the 60-second clock (or three cracked tiles) ends the round.
let mrState = {};
let mrTimerInterval = null;
const MOSAIC_SIZE = 20; // tiles to complete
const MOSAIC_TIME = 60; // seconds

function startMosaicRush(words, label, catId, subId){
  mrState = {
    pool: words, label, catId, subId, score:0, lives:3, timeLeft:MOSAIC_TIME,
    current:null, options:null, answered:false, done:false, tilesFilled:0
  };
  recordLastActivity("mosaic", catId, subId);
  clearInterval(mrTimerInterval);
  mrTimerInterval = setInterval(()=>{
    if(mrState.done) return;
    mrState.timeLeft--;
    if(mrState.timeLeft <= 0){ endMosaicRush(); return; }
    const el = document.getElementById("mrTimeLeft");
    if(el) el.textContent = mrState.timeLeft;
  }, 1000);
  nextMosaicQuestion();
}
function nextMosaicQuestion(){
  if(mrState.done) return;
  mrState.current = mrState.pool[Math.floor(Math.random()*mrState.pool.length)];
  const others = mrState.pool.filter(w=>w.a !== mrState.current.a);
  const distractors = shuffle(others).slice(0,3).map(w=>displayWord(w));
  mrState.options = shuffle([displayWord(mrState.current), ...distractors]);
  mrState.answered = false;
  renderMosaicRush();
}
function endMosaicRush(){
  mrState.done = true;
  clearInterval(mrTimerInterval);
  renderMosaicRush();
}
function crumbHtmlForMosaic(s){
  if(!s.catId) return `<a data-nav="home">Categories</a> <span>›</span> <span>Mosaic Rush — ${s.label}</span>`;
  const cat = DATA.categories.find(c=>c.id===s.catId);

  return `<a data-nav="home">Categories</a> <span>›</span> <a data-nav="cat" data-catid="${cat.id}">${cat.en}</a> <span>›</span> <span>${sub.en} — Mosaic Rush</span>`;
}
function renderMosaicRush(){
  activeRerender = renderMosaicRush;
  const tilesHtml = Array.from({length: MOSAIC_SIZE}).map((_,i)=>
    `<div class="mosaic-tile${i < mrState.tilesFilled ? " filled" : ""}"></div>`
  ).join("");
  if(mrState.done){
    main.innerHTML = `
      <div class="crumbs">${crumbHtmlForMosaic(mrState)}</div>
      <div class="quiz-wrap">
        <div class="fc-done">
          <div style="font-size:44px;">${mrState.tilesFilled>=MOSAIC_SIZE ? "🏆" : "⏱️"}</div>

          <p style="color:var(--text-muted);">${mrState.score} correct · ${mrState.tilesFilled}/${MOSAIC_SIZE} tiles cleared from the night sky</p>
          <div class="mosaic-grid" style="margin:20px auto; max-width:280px;">${tilesHtml}</div>
          <div class="fc-controls" style="margin-top:12px;">
            <button class="btn primary" id="mrAgain">Play again</button>
            <button class="btn" id="mrBack">${mrState.catId ? "Back to subcategories" : "Back to categories"}</button>
          </div>
        </div>
      </div>
    `;
    bindCrumbs();
    document.getElementById("mrAgain").addEventListener("click", ()=>startMosaicRush(mrState.pool, mrState.label, mrState.catId, mrState.subId));
    document.getElementById("mrBack").addEventListener("click", ()=>{
      if(mrState.catId) renderCategory(mrState.catId);
      else setView("home");
    });
    return;
  }
  const w = mrState.current;
  main.innerHTML = `
    <div class="crumbs">${crumbHtmlForMosaic(mrState)}</div>
    <div class="quiz-wrap">
      <div class="quiz-top-row">
        <div class="quiz-score">🕌 ${mrState.label} · Score ${mrState.score} · Lives ${"❤️".repeat(mrState.lives)} · ⏳ <span id="mrTimeLeft">${mrState.timeLeft}</span>s</div>
        <button class="exit-btn" id="mrExitBtn">✕ Exit</button>
      </div>
      <p class="alpha-intro" style="text-align:center; margin-bottom:14px;">Clear the tiles covering the night sky before time or lives run out — get enough right to reveal the skyline underneath.</p>
      <div class="mosaic-grid" id="mosaicGrid" style="margin:0 auto 22px; max-width:280px;">${tilesHtml}</div>
      <div class="quiz-direction-label" style="text-align:center;">Choose the Arabic word for:</div>
      <div class="quiz-word quiz-word-en" style="margin-bottom:14px;">${w.e}</div>
      <div class="quiz-options" id="mrOptions"></div>
    </div>
  `;
  bindCrumbs();
  document.getElementById("mrExitBtn").addEventListener("click", ()=>{
    clearInterval(mrTimerInterval);
    if(mrState.catId) renderCategory(mrState.catId);
    else setView("home");
  });
  const optWrap = document.getElementById("mrOptions");
  const correctText = displayWord(w);
  mrState.options.forEach(optText=>{
    const btn = document.createElement("div");
    btn.className = "quiz-opt quiz-opt-ar";
    btn.textContent = optText;
    btn.addEventListener("click", ()=>{
      if(mrState.answered || mrState.done) return;
      mrState.answered = true;
      const correct = optText === correctText;
      if(correct){
        mrState.score++;
        mrState.tilesFilled = Math.min(MOSAIC_SIZE, mrState.tilesFilled+1);
        if(mrState.tilesFilled >= MOSAIC_SIZE){ endMosaicRush(); return; }
      } else {
        mrState.lives--;
        if(mrState.lives <= 0){ endMosaicRush(); return; }
      }
      setTimeout(nextMosaicQuestion, correct ? 250 : 500);
    });
    optWrap.appendChild(btn);
  });
}

function highlightSentence(w){
  // wrap the target word inside the example sentence with a tooltip span, rest plain
  if(w.s.includes(w.a)){
    return w.s.replace(w.a, wordTip(w));
  }
  return w.s + " " + wordTip(w, 15);
}

  function drawFilterBar(){
    filterBar.innerHTML = filters.map(([key,cls,lbl])=>`
      <button class="diff-pill ${cls} ${filter===key?"active":""}" data-f="${key}"><span class="dot"></span>${lbl}</button>

      renderHistory();
    });
  });
}

function exportProgress(){
  const payload = {
    app:"mufradat", formatVersion:4, exportedAt:new Date().toISOString(),
    wordCount:Object.keys(PROGRESS).length, progress:PROGRESS,
    streak:STREAK, lastActivity:LAST_ACTIVITY, visitedSubs:Array.from(VISITED_SUBS),
    visitedSentenceSubs:Array.from(VISITED_SENTENCE_SUBS), seenSentences:Array.from(SEEN_SENTENCE_IDS)
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "mufradat-progress-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("Progress exported — keep that file somewhere safe.");
}

function importProgressFile(file){
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const payload = JSON.parse(e.target.result);
      const incoming = (payload && typeof payload==="object" && payload.progress) ? payload.progress : payload;
      if(!incoming || typeof incoming !== "object" || Array.isArray(incoming)) throw new Error("bad format");
      PROGRESS = {...PROGRESS, ...incoming};
      await saveProgressNow();
      // Newer exports (formatVersion 2+) also carry streak, last-activity, and visited-subcategory
      // data — restore those too so "Continue where you left off" and the progress highlighting
      // on category/subcategory cards come back correctly after an import, not just word mastery.
      if(payload && typeof payload==="object"){
        if(payload.streak && typeof payload.streak==="object"){
          STREAK = payload.streak;
          await saveStreakNow();
        }
        if(payload.lastActivity && typeof payload.lastActivity==="object"){
          LAST_ACTIVITY = payload.lastActivity;
          await saveLastActivityNow();
        }
        if(Array.isArray(payload.visitedSubs)){
          payload.visitedSubs.forEach(id=>VISITED_SUBS.add(id));
          await saveVisitedSubsNow();
        }
        if(Array.isArray(payload.visitedSentenceSubs)){
          payload.visitedSentenceSubs.forEach(id=>VISITED_SENTENCE_SUBS.add(id));
          await saveVisitedSentenceSubsNow();
        }
        if(Array.isArray(payload.seenSentences)){
          payload.seenSentences.forEach(id=>SEEN_SENTENCE_IDS.add(id));
          await saveSeenSentencesNow();
        }
      }
      const importedCount = Object.keys(incoming).length;
      showToast(`Imported ${importedCount} words' progress (you now have ${Object.keys(PROGRESS).length} tracked total).`);
      renderHistory();
    }catch(err){
      showToast("Couldn't read that file — make sure it's a Mufradat progress export.");
    }
  };
  reader.readAsText(file);
}

/* ============================= SENTENCE BUILDER ============================= */
let builderState = {};

function getBuilderPool(){
  // hand-written sentences only, and only ones with 2+ words — a single-word
  // "sentence" (common with attached object pronouns) makes a trivial, pointless puzzle.
  return allWords().filter(w=>!w.auto && tokenize(w.s).length>=2);
}
function tokenize(sentence){
  return sentence.replace(/[.؟،]+$/,"").trim().split(/\s+/);
}
function shuffleTokensNontrivial(tokens){
  const base = tokens.map((t,i)=>({text:t, uid:i+"_"+Math.random().toString(36).slice(2)}));
  if(base.length<=1) return base;
  let arr, tries=0;
  do{
    arr = shuffle(base);
    tries++;
  } while(arr.map(x=>x.text).join(" ")===tokens.join(" ") && tries<10);
  return arr;
}
function startBuilder(){
  const pool = getBuilderPool();
  builderState = { pool, idx: Math.floor(Math.random()*pool.length), history:[] };
  loadBuilderSentence();
}
function loadBuilderSentence(){
  const w = builderState.pool[builderState.idx];
  builderState.snapshotBefore = PROGRESS[w.id] ? JSON.parse(JSON.stringify(PROGRESS[w.id])) : null;
  const tokens = tokenize(w.s);
  builderState.tokens = tokens;
  builderState.bank = shuffleTokensNontrivial(tokens);
  builderState.placed = [];
  builderState.attempts = 0;
  builderState.currentWord = w;
  renderBuilder();
}
function nextBuilderSentence(){
  builderState.history.push({ idx: builderState.idx, wordId: builderState.currentWord.id, progressBefore: builderState.snapshotBefore });
  let newIdx;
  do{ newIdx = Math.floor(Math.random()*builderState.pool.length); } while(newIdx===builderState.idx && builderState.pool.length>1);
  builderState.idx = newIdx;
  loadBuilderSentence();
}
function undoLastBuilderSentence(){
  const entry = builderState.history.pop();
  if(!entry) return false;
  builderState.idx = entry.idx;
  if(entry.progressBefore === null) delete PROGRESS[entry.wordId];
  else PROGRESS[entry.wordId] = entry.progressBefore;
  saveProgress();
  loadBuilderSentence();
  return true;
}
function renderBuilder(){
  activeRerender = renderBuilder;
  const w = builderState.currentWord;
  main.innerHTML = `
    <div class="hero" style="padding:6px 0 18px; text-align:left;">
      <h1 class="hero-title" style="margin-top:0;">Sentence <em>builder</em></h1>
      <p class="alpha-intro">Tap the Arabic words below, in order, to build the sentence that matches the English prompt. Tap a placed word to send it back to the bank.</p>
    </div>
    <div class="builder-prompt">
      <div class="builder-prompt-label">Build this sentence</div>
      <div class="builder-prompt-en">"${w.x}"</div>
    </div>
    <div class="builder-answer" id="builderAnswer"></div>
    <div class="builder-bank" id="builderBank"></div>
    <div class="builder-controls">
      ${builderState.history.length>0 ? '<button class="btn back-btn" id="builderBackBtn">← Previous sentence</button>' : ""}
      <button class="btn" id="builderShuffle">🔀 Shuffle bank</button>
      <button class="btn teal" id="builderHint">💡 Hint</button>
      <button class="btn primary" id="builderCheck">✓ Check</button>
      <button class="btn" id="builderSkip">Skip →</button>
    </div>
    <div class="builder-feedback" id="builderFeedback"></div>
  `;
  drawBuilderAnswer();
  drawBuilderBank();
  const backBtn = document.getElementById("builderBackBtn");
  if(backBtn) backBtn.addEventListener("click", undoLastBuilderSentence);
  document.getElementById("builderShuffle").addEventListener("click", ()=>{ builderState.bank = shuffle(builderState.bank); drawBuilderBank(); });
  document.getElementById("builderCheck").addEventListener("click", checkBuilder);
  document.getElementById("builderHint").addEventListener("click", showBuilderHint);
  document.getElementById("builderSkip").addEventListener("click", nextBuilderSentence);
}
function drawBuilderAnswer(){
  const el = document.getElementById("builderAnswer");
  if(builderState.placed.length===0){
    el.innerHTML = '<span class="builder-placeholder">Tap words below to build your sentence…</span>';
    return;
  }
  el.innerHTML = builderState.placed.map(tok=>`<button class="tile placed" data-uid="${tok.uid}">${tok.text}</button>`).join("");
  el.querySelectorAll(".tile").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const uid = btn.dataset.uid;
      const idx = builderState.placed.findIndex(t=>t.uid===uid);
      const [tok] = builderState.placed.splice(idx,1);
      builderState.bank.push(tok);
      drawBuilderAnswer(); drawBuilderBank();
      document.getElementById("builderFeedback").innerHTML = "";
    });
  });
}
function drawBuilderBank(){
  const el = document.getElementById("builderBank");
  el.innerHTML = builderState.bank.map(tok=>`<button class="tile" data-uid="${tok.uid}">${tok.text}</button>`).join("");
  el.querySelectorAll(".tile").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const uid = btn.dataset.uid;
      const idx = builderState.bank.findIndex(t=>t.uid===uid);
      const [tok] = builderState.bank.splice(idx,1);
      builderState.placed.push(tok);
      drawBuilderAnswer(); drawBuilderBank();
    });
  });
}
function checkBuilder(){
  const attemptStr = builderState.placed.map(t=>t.text).join(" ");
  const correctStr = builderState.tokens.join(" ");
  const fb = document.getElementById("builderFeedback");
  if(builderState.placed.length < builderState.tokens.length){
    fb.innerHTML = `<div class="builder-wrong">Place all the words first — ${builderState.tokens.length - builderState.placed.length} left.</div>`;
    return;
  }
  builderState.attempts++;
  markResult(builderState.currentWord, attemptStr===correctStr, true);
  if(attemptStr === correctStr){
    fb.innerHTML = `<div class="builder-correct">✅ Correct!</div>`;
    setTimeout(nextBuilderSentence, 1400);
  } else if(builderState.attempts>=3){
    fb.innerHTML = `<div class="builder-wrong">Not quite. The correct sentence is: <span class="ar-inline">${builderState.currentWord.s}</span></div>`;
    setTimeout(nextBuilderSentence, 3200);
  } else {
    fb.innerHTML = `<div class="builder-wrong">Not quite right — try rearranging (attempt ${builderState.attempts}/3).</div>`;
  }
}
function showBuilderHint(){
  const fb = document.getElementById("builderFeedback");
  const nextWord = builderState.tokens[builderState.placed.length];
  if(nextWord){
    fb.innerHTML = `<div class="builder-hint">💡 The next word is <span class="ar-inline">${nextWord[0]}‏‏‏‏‏‏‏‏ـ</span> (${nextWord.length} letters)</div>`;
  } else {
    fb.innerHTML = `<div class="builder-hint">💡 You've placed every word — hit Check!</div>`;
  }
}

/* ============================= INIT ============================= */
function render(){
  if(state.view==="home") renderHome();
  else if(state.view==="category") renderCategory(state.catId);
  else if(state.view==="sentences-all") renderSentencesHub();
  else if(state.view==="alphabet") renderAlphabet();
  else if(state.view==="conjugations"){ conjState.verb=null; renderConjugations(); }
  else if(state.view==="review") renderReview();
  else if(state.view==="history") renderHistory();
  else if(state.view==="builder") startBuilder();
  else if(state.view==="roots") renderRoots();
  else if(state.view==="grammar") renderGrammarGuide();
}
(async function init(){
  assignWordIds();
  buildWordsById();
  await loadProgress();
  await loadStreak();
  await loadLastActivity();
  await loadVisitedSubs();
  await loadVisitedSentenceSubs();
  await loadSeenSentences();
  render();
  initTimerWidget();
  if(state.view === "home") setTimeout(showWelcomeBackPopup, 500);
  // Service worker: only registers over HTTPS/localhost (browsers block it on file:// pages).
  // This is what makes offline use + "Install app" work once this is hosted somewhere.
  if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost")){
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  }
})();
</script>
</body>
</html>
