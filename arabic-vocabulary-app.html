<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mufradat — Arabic Vocabulary</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0F1B2D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mufradat">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400..700&family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1B2D;
    --panel:#16233A;
    --panel-2:#1C2C47;
    --gold:#C9A24B;
    --gold-soft:#e3c988;
    --teal:#2FA6A0;
    --teal-soft:#7FD4CE;
    --text:#F2ECDD;
    --text-muted:#93A4BC;
    --danger:#C1554A;
    --good:#4CA57A;
    --border:rgba(201,162,75,0.28);
    --radius:6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, rgba(47,166,160,0.10), transparent 55%),
      radial-gradient(ellipse at 90% 0%, rgba(201,162,75,0.10), transparent 45%),
      var(--ink);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--gold); color:var(--ink);}

  /* ---------- pattern band ---------- */
  .tile-band{
    height:14px;
    width:100%;
    background-image: repeating-linear-gradient(45deg, rgba(201,162,75,0.5) 0 2px, transparent 2px 14px),
                       repeating-linear-gradient(-45deg, rgba(47,166,160,0.4) 0 2px, transparent 2px 14px);
    opacity:0.65;
  }

  /* ---------- header ---------- */
  header{
    padding:28px 6vw 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex; align-items:baseline; gap:12px; cursor:pointer; flex-shrink:0;}
  .brand-ar{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:30px; color:var(--gold); font-weight:700;}
  .brand-en{font-family:'Fraunces',serif; font-size:22px; font-weight:600; letter-spacing:0.01em;}
  .brand-sub{font-size:11px; color:var(--text-muted); letter-spacing:0.14em; text-transform:uppercase; margin-top:2px;}

  .search-wrap{position:relative; flex:1; max-width:420px; min-width:220px;}
  .search-wrap input{
    width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    padding:11px 14px;
    border-radius:var(--radius);
    font-size:14px;
    font-family:'Inter',sans-serif;
  }
  .search-wrap input:focus{outline:none; border-color:var(--gold);}
  .search-results{
    position:absolute; top:calc(100% + 6px); left:0; right:0;
    background:var(--panel-2); border:1px solid var(--border); border-radius:var(--radius);
    max-height:340px; overflow-y:auto; z-index:50; display:none;
  }
  .search-results.show{display:block;}
  .search-row{padding:10px 14px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.05); cursor:default;}
  .search-row:last-child{border-bottom:none;}
  .search-row .ar{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:19px; color:var(--gold-soft);}
  .search-row .meta{font-size:12px; color:var(--text-muted); text-align:right;}
  .search-empty{padding:14px; font-size:13px; color:var(--text-muted);}

  nav.pillnav{display:flex; gap:8px; flex-wrap:wrap;}
  .pill{
    background:transparent; border:1px solid var(--border); color:var(--text-muted);
    padding:9px 16px; border-radius:999px; font-size:13px; cursor:pointer; font-family:'Inter',sans-serif;
    transition:all .15s ease; white-space:nowrap;
  }
  .pill:hover{border-color:var(--gold); color:var(--text);}
  .pill.active{background:var(--gold); border-color:var(--gold); color:var(--ink); font-weight:600;}

  .tashkeel-toggle{
    background:transparent; border:1px solid var(--teal); color:var(--teal-soft);
    padding:9px 16px; border-radius:999px; font-size:12.5px; cursor:pointer; font-family:'Inter',sans-serif;
    display:flex; align-items:center; gap:8px; transition:all .15s ease;
  }
  .tashkeel-toggle:hover{background:rgba(47,166,160,0.1);}
  .tashkeel-toggle.on{background:var(--teal); border-color:var(--teal); color:var(--ink); font-weight:600;}
  .tk-sample{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:16px;}

  main{padding:34px 6vw 80px; max-width:1180px; margin:0 auto;}

  /* ---------- hero ---------- */
  .hero{padding:26px 0 44px; text-align:center;}
  .hero-flash{
    font-family:'Noto Naskh Arabic','Amiri',serif; font-size:clamp(48px,9vw,88px); color:var(--gold);
    height:1.3em; display:flex; align-items:center; justify-content:center;
    transition:opacity .5s ease;
  }
  .hero-flash-en{font-size:14px; color:var(--text-muted); letter-spacing:0.08em; text-transform:uppercase; margin-top:6px;}
  .hero-title{font-family:'Fraunces',serif; font-size:clamp(28px,4vw,44px); font-weight:600; margin:22px 0 10px;}
  .hero-title em{color:var(--teal-soft); font-style:normal;}
  .hero-desc{color:var(--text-muted); font-size:15px; max-width:560px; margin:0 auto 22px; line-height:1.6;}
  .hero-stats{display:flex; gap:30px; justify-content:center; margin-top:18px; flex-wrap:wrap;}
  .streak-sub{text-align:center; font-size:11.5px; color:var(--text-muted); margin-top:10px;}
  .due-today-banner{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    background:linear-gradient(135deg, rgba(201,162,75,0.12), rgba(47,166,160,0.08));
    border:1px solid var(--gold); border-radius:8px; padding:18px 22px; margin:20px 0;
  }
  .due-today-title{font-family:'Fraunces',serif; font-weight:600; font-size:16px;}
  .due-today-sub{font-size:12px; color:var(--text-muted); margin-top:4px; max-width:480px;}

  /* ---------- roots ---------- */
  .root-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px;}
  .root-card{
    background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:20px;
  }
  .root-letters{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:28px; color:var(--gold-soft); direction:rtl; letter-spacing:4px;}
  .root-meaning{font-size:12.5px; color:var(--teal-soft); margin:4px 0 14px; font-style:italic;}
  .root-word-row{
    display:flex; justify-content:space-between; align-items:baseline; gap:10px;
    padding:9px 0; border-bottom:1px dashed var(--border);
  }
  .root-word-row:last-child{border-bottom:none;}
  .root-word-ar{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:19px; direction:rtl; color:var(--text);}
  .root-word-meta{font-size:11.5px; color:var(--text-muted); text-align:right; flex-shrink:0;}
  .stat{text-align:center;}
  .stat-num{font-family:'Fraunces',serif; font-size:26px; color:var(--teal-soft); font-weight:600;}
  .stat-label{font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.1em;}

  /* ---------- category grid ---------- */
  .section-label{
    font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--teal-soft);
    margin:44px 0 16px; display:flex; align-items:center; gap:10px;
  }
  .section-label::after{content:''; flex:1; height:1px; background:var(--border);}

  .cat-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px;}
  .cat-card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px; cursor:pointer; transition:transform .18s ease, border-color .18s ease, background .18s ease;
    position:relative; overflow:hidden;
  }
  .cat-card:hover{transform:translateY(-3px); border-color:var(--gold); background:var(--panel-2);}
  .cat-card .icon{font-size:26px; margin-bottom:10px; display:block;}
  .cat-card .name-ar{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:21px; color:var(--gold-soft); display:block;}
  .cat-card .name-en{font-family:'Fraunces',serif; font-size:17px; font-weight:600; margin-top:2px;}
  .cat-card .count{font-size:12px; color:var(--text-muted); margin-top:8px;}

  .crumbs{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-muted); margin-bottom:22px; flex-wrap:wrap;}
  .crumbs a{color:var(--teal-soft); cursor:pointer; text-decoration:none;}
  .crumbs a:hover{text-decoration:underline;}

  .sub-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; margin-bottom:10px;}
  .sub-card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:18px;
  }
  .sub-card .name-en{font-family:'Fraunces',serif; font-size:17px; font-weight:600;}
  .sub-card .name-ar{font-family:'Noto Naskh Arabic','Amiri',serif; color:var(--gold-soft); font-size:16px; margin-left:6px;}
  .sub-card .count{font-size:12px; color:var(--text-muted); margin:6px 0 14px;}
  .sub-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .btn{
    border:1px solid var(--border); background:transparent; color:var(--text);
    padding:8px 13px; border-radius:var(--radius); font-size:12.5px; cursor:pointer; font-family:'Inter',sans-serif;
    transition:all .15s ease;
  }
  .btn:hover{border-color:var(--teal); color:var(--teal-soft);}
  .btn.primary{background:var(--gold); border-color:var(--gold); color:var(--ink); font-weight:600;}
  .btn.primary:hover{background:var(--gold-soft); color:var(--ink);}
  .btn.teal{border-color:var(--teal); color:var(--teal-soft);}

  .word-preview{display:flex; flex-wrap:wrap; gap:6px 10px; margin-top:12px; padding-top:12px; border-top:1px dashed var(--border);}

  /* word tooltip spans */
  .w-tip{position:relative; cursor:help; border-bottom:1px dotted var(--gold-soft); font-family:'Noto Naskh Arabic','Amiri',serif; color:var(--text); font-size:15px;}
  .w-tip .tip-bubble{
    position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%);
    background:var(--gold); color:var(--ink); padding:6px 10px; border-radius:4px;
    font-family:'Inter',sans-serif; font-size:12px; white-space:nowrap; font-weight:600;
    opacity:0; pointer-events:none; transition:opacity .15s ease; z-index:60;
  }
  .w-tip .tip-bubble::after{
    content:''; position:absolute; top:100%; left:50%; transform:translateX(-50%);
    border:5px solid transparent; border-top-color:var(--gold);
  }
  .w-tip:hover .tip-bubble, .w-tip.show-tip .tip-bubble{opacity:1;}

  /* ---------- flashcards ---------- */
  .fc-wrap{display:flex; flex-direction:column; align-items:center; padding:20px 0;}
  .fc-progress{width:100%; max-width:480px; height:4px; background:var(--panel); border-radius:99px; overflow:hidden; margin-bottom:26px;}
  .fc-progress-bar{height:100%; background:linear-gradient(90deg,var(--teal),var(--gold)); transition:width .3s ease;}
  .fc-meta{font-size:12px; color:var(--text-muted); margin-bottom:10px; letter-spacing:0.06em; text-transform:uppercase;}

  .card{
    width:100%; max-width:480px; height:290px; perspective:1400px; cursor:pointer; margin-bottom:22px;
  }
  .card-inner{
    position:relative; width:100%; height:100%; transition:transform .5s cubic-bezier(.4,.2,.2,1); transform-style:preserve-3d;
  }
  .card.flipped .card-inner{transform:rotateY(180deg);}
  .card-face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:12px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    border:1px solid var(--border); padding:24px;
  }
  .card-front{background:linear-gradient(160deg,var(--panel),var(--panel-2));}
  .card-back{background:linear-gradient(160deg,var(--panel-2),var(--panel)); transform:rotateY(180deg);}
  .card-word{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:52px; color:var(--gold-soft); direction:rtl;}
  .card-pos{font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.1em; margin-top:14px;}
  .card-translit{font-family:'Fraunces',serif; font-size:15px; color:var(--text-muted); margin-top:10px; font-style:italic;}
  .card-en{font-family:'Fraunces',serif; font-size:30px; font-weight:600; color:var(--text);}
  .card-ex{margin-top:16px; font-size:13px; color:var(--text-muted); line-height:1.6;}
  .card-ex .ar{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:17px; color:var(--teal-soft); direction:rtl; display:block; margin-bottom:4px;}
  .card-hint{font-size:11px; color:var(--text-muted); margin-top:10px; letter-spacing:0.05em;}

  .fc-controls{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
  .fc-controls .btn{padding:11px 18px; font-size:13px;}
  .fc-controls .btn.know{border-color:var(--good); color:var(--good);}
  .fc-controls .btn.know:hover{background:var(--good); color:var(--ink);}
  .fc-controls .btn.again{border-color:var(--danger); color:var(--danger);}
  .fc-controls .btn.again:hover{background:var(--danger); color:var(--ink);}

  .fc-done{text-align:center; padding:40px 0;}
  .fc-done .big{font-family:'Fraunces',serif; font-size:30px; margin-bottom:8px;}

  /* ---------- quiz ---------- */
  .quiz-wrap{max-width:520px; margin:0 auto; text-align:center;}
  .quiz-score{font-size:12px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:18px;}
  .quiz-word{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:56px; color:var(--gold-soft); margin-bottom:6px; direction:rtl;}
  .quiz-translit{font-family:'Fraunces',serif; font-style:italic; color:var(--text-muted); margin-bottom:30px;}
  .quiz-speak-btn{display:inline-flex; vertical-align:middle; margin-left:12px; width:34px; height:34px; font-size:14px;}
  .quiz-direction-label{font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--teal-soft); margin-bottom:8px;}
  .quiz-word-en{font-family:'Fraunces',serif; font-size:32px; font-weight:600; color:var(--text); direction:ltr; margin-bottom:30px;}
  .quiz-opt-ar{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:19px; direction:rtl; text-align:right;}
  .card-speak-btn{position:absolute; top:14px; right:14px; width:32px; height:32px; font-size:13px;}
  .quiz-options{display:grid; gap:10px;}
  .quiz-opt{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px;
    cursor:pointer; font-size:15px; text-align:left; transition:all .15s ease;
  }
  .quiz-opt:hover{border-color:var(--teal);}
  .quiz-opt.correct{background:rgba(76,165,122,0.18); border-color:var(--good); color:var(--good);}
  .quiz-opt.wrong{background:rgba(193,85,74,0.18); border-color:var(--danger); color:var(--danger);}
  .quiz-opt.disabled{pointer-events:none;}
  .quiz-next{margin-top:20px;}

  /* ---------- sentences ---------- */
  .sentence-card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 20px; margin-bottom:12px;
  }
  .sentence-ar{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:22px; direction:rtl; text-align:right; line-height:1.9;}
  .sentence-toggle{
    margin-top:10px; font-size:12px; color:var(--teal-soft); cursor:pointer; letter-spacing:0.04em;
    display:inline-block; border-bottom:1px dotted var(--teal-soft);
  }
  .sentence-en{margin-top:8px; font-size:13.5px; color:var(--text-muted); display:none; line-height:1.6;}
  .sentence-en.show{display:block;}

  /* ---------- alphabet ---------- */
  .alpha-intro{color:var(--text-muted); font-size:14px; max-width:680px; line-height:1.7; margin-bottom:8px;}
  .alpha-note{
    display:inline-flex; align-items:center; gap:8px; font-size:12px; color:var(--teal-soft);
    background:rgba(47,166,160,0.08); border:1px solid rgba(47,166,160,0.28); border-radius:999px;
    padding:7px 14px; margin:14px 0 30px;
  }
  .alpha-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; margin-bottom:12px;}
  .letter-card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px;
    display:flex; flex-direction:column; gap:8px;
  }
  .letter-top{display:flex; align-items:center; justify-content:space-between;}
  .letter-big{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:44px; color:var(--gold-soft); direction:rtl;}
  .letter-names{text-align:right;}
  .letter-name-ar{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:15px; color:var(--text);}
  .letter-name-en{font-family:'Fraunces',serif; font-size:13px; color:var(--text-muted); font-style:italic;}
  .letter-forms{
    display:flex; justify-content:space-between; gap:6px; padding:10px 4px;
    border-top:1px dashed var(--border); border-bottom:1px dashed var(--border);
  }
  .letter-form{text-align:center; flex:1;}
  .letter-form .glyph{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:22px; direction:rtl; color:var(--teal-soft);}
  .letter-form .lbl{font-size:9px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.06em; margin-top:3px;}
  .letter-tip{font-size:12px; color:var(--text-muted); line-height:1.5;}
  .letter-example{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--panel-2); border-radius:5px; padding:8px 10px;
  }
  .letter-example .ex-word{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:18px; color:var(--gold-soft); direction:rtl;}
  .letter-example .ex-meta{font-size:11px; color:var(--text-muted);}
  .speak-btn{
    background:var(--gold); border:none; color:var(--ink); width:30px; height:30px; border-radius:50%;
    cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
    transition:transform .12s ease;
  }
  .speak-btn:hover{transform:scale(1.1);}
  .speak-btn:active{transform:scale(0.92);}

  .harakat-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; margin-bottom:10px;}
  .harakat-card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px; display:flex; align-items:center; gap:14px;}
  .harakat-glyph{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:38px; color:var(--gold-soft); direction:rtl; min-width:50px; text-align:center;}
  .harakat-info .name{font-family:'Fraunces',serif; font-weight:600; font-size:15px;}
  .harakat-info .desc{font-size:12px; color:var(--text-muted); margin-top:3px; line-height:1.5;}

  /* ---------- conjugations ---------- */
  .grammar-explainer{
    background:linear-gradient(160deg,var(--panel),var(--panel-2)); border:1px solid var(--border); border-radius:8px;
    padding:24px 26px; margin-bottom:30px;
  }
  .grammar-explainer h3{font-family:'Fraunces',serif; font-size:18px; font-weight:600; margin:0 0 12px;}
  .grammar-terms{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin:18px 0;}
  .grammar-term{background:var(--ink); border:1px solid var(--border); border-radius:6px; padding:14px 16px;}
  .grammar-term .term-name{font-family:'Fraunces',serif; font-weight:600; color:var(--gold-soft); font-size:14.5px; margin-bottom:5px;}
  .grammar-term .term-desc{font-size:12.5px; color:var(--text-muted); line-height:1.6;}
  .grammar-example{
    font-family:'Noto Naskh Arabic','Amiri',serif; direction:rtl; font-size:16px; color:var(--teal-soft);
    display:inline; margin-top:4px;
  }
  .grammar-why{font-size:13.5px; color:var(--text); line-height:1.7; margin-top:14px; padding-top:14px; border-top:1px dashed var(--border);}

  .person-cell{display:flex; flex-direction:column; gap:4px;}
  .person-badges{display:flex; gap:5px;}
  .gn-badge{
    font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
    padding:2px 7px; border-radius:4px; border:1px solid var(--border); color:var(--text-muted);
  }
  .gn-badge.gender-M{border-color:var(--teal); color:var(--teal-soft);}
  .gn-badge.gender-F{border-color:var(--gold); color:var(--gold-soft);}
  .person-usage{font-size:10.5px; color:var(--text-muted); font-style:italic; max-width:170px; line-height:1.4;}

  .pattern-wrap{
    background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:22px 24px; margin-bottom:34px;
  }
  .pattern-verb{display:flex; align-items:baseline; gap:14px; margin-bottom:6px; flex-wrap:wrap;}

    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;

  }
  .verb-detail-header .v-ar{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:40px; color:var(--gold-soft); direction:rtl;}
  .verb-detail-header .v-en{font-family:'Fraunces',serif; font-size:18px; font-weight:600;}

  .diff-desc{font-size:12.5px; color:var(--text-muted); margin:4px 0 18px; min-height:18px;}

    display:inline-block; font-size:9.5px; text-transform:uppercase; letter-spacing:0.06em; font-weight:700;

  .progress-track{

  .progress-seg.mastered{background:var(--good);}

  .progress-legend .dot.shaky{background:var(--danger);}

  .ar-inline{font-family:'Noto Naskh Arabic','Amiri',serif; font-size:17px; direction:rtl; display:inline-block;}

  footer{text-align:center; padding:30px 6vw 50px; font-size:12px; color:var(--text-muted); border-top:1px solid var(--border); margin-top:40px;}

  @media (max-width:640px){

    .tashkeel-toggle{order:4; font-size:11.5px; padding:8px 12px;}
    main{padding:24px 5vw 60px;}
    .hero-title{font-size:26px;}
    .card{height:260px;}
    .card-word{font-size:40px;}
    .conj-tables-grid{grid-template-columns:1fr;}
    table.conj-table{display:block; overflow-x:auto; white-space:nowrap;}
    .harakat-grid, .alpha-grid{grid-template-columns:1fr 1fr;}
    .cat-grid, .sub-grid, .verb-grid{grid-template-columns:1fr;}
    .grammar-terms{grid-template-columns:1fr;}
    .hist-row{gap:8px; padding:10px 12px;}
    .hist-cat{flex-basis:100%; order:5;}
    .speak-btn{width:34px; height:34px;}
    .quiz-options .quiz-opt{padding:14px 12px;}
    .builder-answer, .builder-bank{padding:12px;}
    .tile{padding:10px 14px; font-size:17px;}
  }
  @media (max-width:400px){
    .brand-sub{display:none;}
    .harakat-grid, .alpha-grid{grid-template-columns:1fr;}
    .hero-stats{gap:18px;}
  }

    .cat-card, .sub-card, .letter-card, .verb-card{transform:none !important;}
    .btn, .pill, .diff-pill, .speak-btn, .tile, .quiz-opt{min-height:40px;}
  }
</style>

/* ============================= HELPERS FOR EXTENDED VOCAB ============================= */
function autoSentence(w){
  const a = w.a;
  if(a.indexOf(" ")!==-1){ return {s:a, x:w.e}; }
  if(w.p==="n"){
    const fem = /[ةاؤء]$/.test(a) || /ى$/.test(a);
    return fem ? {s:"هذه ال"+a+" جميلة.", x:"This "+w.e+" is beautiful."}
                : {s:"هذا ال"+a+" جميل.", x:"This "+w.e+" is beautiful."};
  }
  if(w.p==="v"){ return {s:"هو "+a+" أمس.", x:"He did this — "+w.e+" (past tense)."}; }
  if(w.p==="adj"){ return {s:"هذا الشيء "+a+" جداً.", x:"This thing is very "+w.e+"."}; }
  if(w.p==="num"){ return {s:"العدد هو "+a+".", x:"The number is "+w.e+"."}; }
  return {s:a, x:w.e};
}
function mkWords(list){
  return list.map(t=>{
    const w = {a:t[0], t:t[1], e:t[2], p:t[3]};

    { id:"essentials-basic", en:"Essential Words & Pronouns", ar:"الكلمات الأساسية والضمائر", icon:"🔑", diff:"easy",
      note:"You may have noticed: there's no Arabic word for \"am / is / are.\" That's not a gap in this app — Arabic genuinely doesn't use a linking verb in the present tense. \"I am happy\" is just أنا سعيد (literally \"I happy\") — two words placed side by side. This category covers exactly the words English speakers expect to find and don't: how \"my / your / his / her\" attach directly onto nouns instead of standing alone, how \"me / you / him\" attach onto verbs the same way, how to say \"I have\" (Arabic has no verb \"to have\" either — it uses \"at me\"), the word for \"the,\" and the small particles that carry huge grammatical weight (negation, emphasis, future tense).",

      { id:"possessive-suffixes", en:"Possessive Suffixes — \"my/your/his...\"", ar:"ضمائر الملكية", words:[
        {a:"ـي", t:"-i", e:"my", p:"part", s:"هٰذَا كِتَابِي.", x:"This is my book."},
        {a:"ـكَ", t:"-ka", e:"your (to a male)", p:"part", s:"أَيْنَ كِتَابُكَ؟", x:"Where is your book?"},
        {a:"ـكِ", t:"-ki", e:"your (to a female)", p:"part", s:"أَيْنَ كِتَابُكِ؟", x:"Where is your book?"},
        {a:"ـه", t:"-hu", e:"his", p:"part", s:"كِتَابُهُ جَدِيدٌ.", x:"His book is new."},
        {a:"ـها", t:"-ha", e:"her", p:"part", s:"كِتَابُهَا جَمِيلٌ.", x:"Her book is beautiful."},
        {a:"ـنا", t:"-na", e:"our", p:"part", s:"هٰذَا بَيْتُنَا.", x:"This is our house."},
        {a:"ـكم", t:"-kum", e:"your (to a group)", p:"part", s:"أَيْنَ بَيْتُكُمْ؟", x:"Where is your (all's) house?"},
        {a:"ـكنّ", t:"-kunna", e:"your (to a group of women)", p:"part", s:"أَيْنَ بَيْتُكُنَّ؟", x:"Where is your (all's) house?"},
        {a:"ـهم", t:"-hum", e:"their (males / mixed group)", p:"part", s:"هٰذَا بَيْتُهُمْ.", x:"This is their house."},
        {a:"ـهنّ", t:"-hunna", e:"their (group of women)", p:"part", s:"هٰذَا بَيْتُهُنَّ.", x:"This is their house."}

function speak(text){
  if(!("speechSynthesis" in window)){
    alert("Your browser doesn't support text-to-speech. Try Chrome, Edge, or Safari.");
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "ar-SA";
  utter.rate = 0.75;
  window.speechSynthesis.speak(utter);
}

/* ============================= HELPERS ============================= */
let showTashkeel = false;
function displayWord(w){ return (showTashkeel && w.tk) ? w.tk : w.a; }
function allWords(){
  const out=[];
  DATA.categories.forEach(c=>c.subs.forEach(s=>s.words.forEach(w=>out.push({...w, cat:c, sub:s}))));
  return out;
}
function wordTip(w, size){
  return `<span class="w-tip" style="${size?`font-size:${size}px`:''}" tabindex="0">${displayWord(w)}<span class="tip-bubble">${w.t} — ${w.e}</span></span>`;
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function totalWordCount(){ return allWords().length; }

/* ============================= PROGRESS TRACKING ============================= */
const STORAGE_KEY = "progress-v1";
const MASTERY_STREAK = 4;
const POPQUIZ_NEEDED = 3;
let PROGRESS = {};
let WORDS_BY_ID = {};

// Storage backend: prefer Claude's artifact storage (works inside claude.ai),
// fall back to the browser's own localStorage (works once this is hosted or opened as a file/app),
// fall back to in-memory only as a last resort (progress won't survive a reload).
const STORAGE_BACKEND = (()=>{
  if(typeof window.storage !== "undefined") return "claude";
  try{
    const t = "__mufradat_test__";
    localStorage.setItem(t, "1");
    localStorage.removeItem(t);
    return "local";
  }catch(e){ return "memory"; }
})();
let PERSISTENCE_AVAILABLE = STORAGE_BACKEND !== "memory";
let _memoryStore = {};

function assignWordIds(){
  DATA.categories.forEach(c=>{
    c.subs.forEach(s=>{
      s.words.forEach((w,idx)=>{ w.id = c.id+"::"+s.id+"::"+idx; });
    });
  });
}
function buildWordsById(){
  WORDS_BY_ID = {};
  allWords().forEach(w=>{ WORDS_BY_ID[w.id] = w; });
}
async function loadProgress(){
  try{
    if(STORAGE_BACKEND === "claude"){
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value) PROGRESS = JSON.parse(res.value);
    } else if(STORAGE_BACKEND === "local"){
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) PROGRESS = JSON.parse(raw);
    } else if(_memoryStore[STORAGE_KEY]){
      PROGRESS = JSON.parse(_memoryStore[STORAGE_KEY]);
    }
  }catch(e){ /* no saved progress yet */ }
}
let saveTimer=null;
function saveProgress(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ saveProgressNow(); }, 350);
}
async function saveProgressNow(){
  const json = JSON.stringify(PROGRESS);
  try{
    if(STORAGE_BACKEND === "claude"){
      await window.storage.set(STORAGE_KEY, json, false);
    } else if(STORAGE_BACKEND === "local"){
      localStorage.setItem(STORAGE_KEY, json);
    } else {
      _memoryStore[STORAGE_KEY] = json;
    }
  }catch(e){ console.warn("Progress save failed", e); }
}

function getProgress(id){
  return PROGRESS[id] || {status:"new", seen:0, correct:0, wrong:0, streak:0, lastSeen:null, masteredAt:null, popQuizPending:0};
}

  try{

    }

}
async function saveStreakNow(){
  const json = JSON.stringify(STREAK);
  try{
    if(STORAGE_BACKEND === "claude") await window.storage.set(STREAK_KEY, json, false);
    else if(STORAGE_BACKEND === "local") localStorage.setItem(STREAK_KEY, json);
    else _memoryStore[STREAK_KEY] = json;
  }catch(e){ console.warn("Streak save failed", e); }

function todayString(offsetDays){
  const d = new Date();
  if(offsetDays) d.setDate(d.getDate()-offsetDays);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
let _streakUpdatedThisSession = false;
function recordActivityToday(){
  const today = todayString();
  if(STREAK.lastActiveDate === today){ return; }
  const yesterday = todayString(1);
  STREAK.current = (STREAK.lastActiveDate === yesterday) ? (STREAK.current||0) + 1 : 1;
  STREAK.longest = Math.max(STREAK.longest||0, STREAK.current);
  STREAK.totalDaysActive = (STREAK.totalDaysActive||0) + 1;
  STREAK.lastActiveDate = today;
  _streakUpdatedThisSession = true;
  saveStreak();
}

// Returns {demoted} — demoted=true when a mastered word was just missed and downgraded to "shaky"
function markResult(word, correct){
  recordActivityToday();
  const id = word.id;
  let p = PROGRESS[id] || {status:"new", seen:0, correct:0, wrong:0, streak:0, lastSeen:null, masteredAt:null, popQuizPending:0};
  p.seen++;
  p.lastSeen = Date.now();
  let demoted = false;
  if(correct){
    p.correct++;
    p.streak++;
    if(p.status==="shaky"){
      p.popQuizPending = Math.max(0, p.popQuizPending-1);
      if(p.popQuizPending===0){ p.status="mastered"; p.masteredAt=Date.now(); p.streak=0; }
    } else if(p.status!=="mastered"){
      p.status = (p.streak>=MASTERY_STREAK) ? "mastered" : "learning";
      if(p.status==="mastered") p.masteredAt = Date.now();
    }
  } else {
    p.wrong++;
    p.streak=0;
    if(p.status==="mastered"){
      p.status="shaky";
      p.popQuizPending = POPQUIZ_NEEDED;
      demoted = true;
    } else if(p.status==="shaky"){
      p.popQuizPending = POPQUIZ_NEEDED;
    } else {
      p.status = "learning";
    }
  }

  // Spaced-repetition scheduling (simplified SM-2) — runs independently of the
  // mastered/shaky status above, so it isn't affected by that system's own resets.
  p.srsReps = correct ? (p.srsReps||0) + 1 : 0;
  p.easeFactor = p.easeFactor || 2.5;
  if(correct){
    if(p.srsReps === 1) p.interval = 1;
    else if(p.srsReps === 2) p.interval = 6;
    else p.interval = Math.round((p.interval||6) * p.easeFactor);
    p.easeFactor = Math.max(1.3, p.easeFactor + 0.1);
  } else {
    p.interval = 1;
    p.easeFactor = Math.max(1.3, p.easeFactor - 0.2);
  }
  p.nextReview = Date.now() + p.interval*24*60*60*1000;

  PROGRESS[id] = p;
  saveProgress();
  return {demoted, progress:p};
}

function getDueWords(){
  const now = Date.now();
  return allWords().filter(w=>{
    const p = PROGRESS[w.id];
    return p && p.nextReview && p.nextReview <= now;
  });
}

// Marks any shaky words already in the deck, and randomly injects a couple more from elsewhere
function annotateAndInjectPopQuizzes(deck){
  deck.forEach(w=>{ const p = PROGRESS[w.id]; if(p && p.status==="shaky") w.isPopQuiz = true; });
  const existingIds = new Set(deck.map(w=>w.id));
  const candidates = Object.keys(PROGRESS).filter(id=> PROGRESS[id].status==="shaky" && WORDS_BY_ID[id] && !existingIds.has(id));
  shuffle(candidates).slice(0,2).forEach(id=>{
    const w = {...WORDS_BY_ID[id], isPopQuiz:true};
    const pos = Math.min(deck.length, Math.floor(Math.random()*deck.length)+1);
    deck.splice(pos, 0, w);
  });
  return deck;
}

    t.id = "appToast";
    t.className = "app-toast";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove("show"), 4500);
}

function timeAgo(ts){
  if(!ts) return "—";
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return "just now";
  if(s<3600) return Math.floor(s/60)+"m ago";
  if(s<86400) return Math.floor(s/3600)+"h ago";
  return Math.floor(s/86400)+"d ago";
}

function renderAlphabet(){
  main.innerHTML = `
    <div class="hero" style="padding:6px 0 18px; text-align:left;">
      <h1 class="hero-title" style="margin-top:0;">The Arabic <em>alphabet</em></h1>
      <p class="alpha-intro">Arabic is written right-to-left in a cursive script — most letters connect to their neighbors and change shape slightly depending on whether they sit at the start, middle, or end of a word. There are 28 letters, all consonants (plus the hamza), and short vowels are shown with small marks above or below the letter rather than separate letters.</p>
      <div class="alpha-note">🔊 Tap any speaker icon to hear it — uses your browser's built-in text-to-speech (best in Chrome, Edge, or Safari).</div>
    </div>
    <div class="section-label">The 28 letters + hamza</div>
    <div class="alpha-grid" id="alphaGrid"></div>
    <div class="section-label">Short vowels &amp; marks — تشكيل (tashkeel)</div>
    <div class="grammar-explainer" style="margin-bottom:24px;">
      <h3>Why tashkeel exists — and why you'll stop seeing it</h3>
      <p class="alpha-intro" style="margin-bottom:0;">"Tashkeel" (تشكيل, also called <em>harakat</em>) is the umbrella term for fatha, kasra, damma, sukun, shadda, and tanwin — the small marks above or below a letter that spell out the short vowels. The letters themselves only carry consonant sounds; without a mark, you genuinely can't tell whether كتب is <em>kataba</em> (he wrote), <em>kutub</em> (books), or <em>kutiba</em> (it was written) — same three letters, three different words.</p>
      <div class="grammar-why" style="margin-top:16px;">
        Here's the part that surprises most learners: <strong>almost no adult Arabic text uses tashkeel.</strong> Newspapers, novels, street signs, and text messages are written "bare" — just the consonant skeleton. Fluent readers fill in the vowels automatically from grammar and context, the same way an English reader doesn't sound out every letter of "the." Tashkeel is reserved for exactly the situations where ambiguity can't be tolerated: the <strong>Qur'an</strong> (to lock in one precise, unchangeable recitation), <strong>children's early-reading books</strong> and <strong>language textbooks</strong> (to remove guesswork while you're still building vocabulary), <strong>dictionaries</strong> (so you know how to actually say the headword), and occasionally <strong>poetry</strong>, where the meter depends on exact vowel length.
      </div>
      <div class="grammar-why" style="border-top:none; padding-top:0;">
        So think of tashkeel as training wheels, not a permanent feature: right now it helps you pronounce words correctly and hear the grammar (a fatha vs. a kasra can be the whole difference between "he" and "you" in a verb). As your reading improves, you'll gradually rely on it less — which is exactly what happens to every native speaker. Use the toggle at the top of the page to show tashkeel on words throughout the app wherever it's available.
      </div>
    </div>
    <p class="alpha-intro" style="margin-bottom:20px;">The six marks themselves:</p>

  `;

          <div class="letter-name-en">${L.name_en} — "${L.t}"</div>
        </div>
      </div>
      <div class="letter-forms">
        <div class="letter-form"><div class="glyph">${L.a}</div><div class="lbl">Isolated</div></div>
        <div class="letter-form"><div class="glyph">${L.a}ـ</div><div class="lbl">Initial</div></div>
        <div class="letter-form"><div class="glyph">ـ${L.a}ـ</div><div class="lbl">Medial</div></div>
        <div class="letter-form"><div class="glyph">ـ${L.a}</div><div class="lbl">Final</div></div>
      </div>
      <div class="letter-tip">${L.tip}</div>
      <div class="letter-example">
        <div>
          <div class="ex-word">${L.ex.w}</div>

        </div>
        <button class="speak-btn" title="Listen" data-word="${L.ex.w}">🔊</button>
      </div>
    `;
    card.querySelector(".speak-btn").addEventListener("click", ()=>speak(L.ex.w));
    grid.appendChild(card);
  });
  const hgrid = document.getElementById("harakatGrid");
  HARAKAT.forEach(h=>{
    const card = document.createElement("div");
    card.className="harakat-card";
    card.innerHTML = `

}

let fcState = {};

function startFlashcards(catId, subId){
  const cat = DATA.categories.find(c=>c.id===catId);

  renderFlashcard();
}
function startFlashcardsSession(words, label){
  fcState = { cat:null, sub:null, label, sourceWords: words, deck: annotateAndInjectPopQuizzes(shuffle(words)), i:0, known:0 };
  renderFlashcard();
}

function crumbHtml(fs, suffix){
  return fs.cat
    ? `<a data-nav="home">Categories</a> <span>›</span> <a data-nav="cat">${fs.cat.en}</a> <span>›</span> <span>${fs.sub.en}${suffix||""}</span>`
    : `<a data-nav="home">Categories</a> <span>›</span> <span>${fs.label}${suffix||""}</span>`;
}

function renderFlashcard(){
  if(fcState.i >= fcState.deck.length){
    main.innerHTML = `
      <div class="crumbs">${crumbHtml(fcState)}</div>
      <div class="fc-done">

    `;
    bindCrumbs();

      else startFlashcardsSession(fcState.sourceWords, fcState.label);
    });
    document.getElementById("fcQuiz").addEventListener("click", ()=>{
      if(fcState.cat) startQuiz(fcState.cat.id, fcState.sub.id);
      else startQuizSession(fcState.sourceWords, fcState.label);
    });
    document.getElementById("fcBack").addEventListener("click", ()=>{
      if(fcState.cat) renderCategory(fcState.cat.id);
      else setView("home");

  }
  const w = fcState.deck[fcState.i];
  const pct = Math.round((fcState.i/fcState.deck.length)*100);
  main.innerHTML = `
    <div class="crumbs">${crumbHtml(fcState, " — Flashcards")}</div>
    <div class="fc-wrap">
      <div class="fc-progress"><div class="fc-progress-bar" style="width:${pct}%"></div></div>
      <div class="fc-meta">Card ${fcState.i+1} of ${fcState.deck.length}</div>
      ${w.isPopQuiz ? '<div class="popquiz-badge">🔔 Pop quiz — you marked this mastered before</div>' : ""}
      <div class="card" id="fcCard">
        <div class="card-inner">
          <div class="card-face card-front">
            <div class="card-word">${displayWord(w)}</div>
            <div class="card-pos">${w.p||''}</div>
            <button class="speak-btn card-speak-btn" id="fcSpeakBtn" title="Listen">🔊</button>
            <div class="card-hint">Tap to reveal meaning</div>
            ${showTashkeel && !w.tk ? '<div class="card-hint" style="color:var(--danger); margin-top:2px;">⚠️ Diacritics not added yet for this word</div>' : ""}
          </div>
          <div class="card-face card-back">
            <div class="card-en">${w.e}</div>
            <div class="card-translit">${w.t}</div>
            <div class="card-ex"><span class="ar">${w.s}</span>${w.x}</div>
          </div>
        </div>
      </div>
      <div class="fc-controls">
        <button class="btn again" id="fcAgainBtn">↺ Still learning</button>
        <button class="btn know" id="fcKnowBtn">✓ Got it</button>

  document.getElementById("fcKnowBtn").addEventListener("click", (e)=>{

    fcState.known++; fcState.i++; renderFlashcard();

/* ============================= QUIZ ============================= */
let qzState = {};

function startQuiz(catId, subId){
  const cat = DATA.categories.find(c=>c.id===catId);
  const sub = cat.subs.find(s=>s.id===subId);
  qzState = { cat, sub, label: sub.en, sourceWords: sub.words, deck: annotateAndInjectPopQuizzes(shuffle(sub.words)), i:0, score:0, answered:false };
  renderQuiz();
}
function startQuizSession(words, label){
  qzState = { cat:null, sub:null, label, sourceWords: words, deck: annotateAndInjectPopQuizzes(shuffle(words)), i:0, score:0, answered:false };
  renderQuiz();
}

function buildOptions(correctWord, pool){
  const others = pool.filter(w=>w.e!==correctWord.e);
  const distractors = shuffle(others).slice(0,3).map(w=>w.e);
  return shuffle([correctWord.e, ...distractors]);
}
function buildOptionsReverse(correctWord, pool){
  const others = pool.filter(w=>w.a!==correctWord.a);
  const distractors = shuffle(others).slice(0,3).map(w=>displayWord(w));
  return shuffle([displayWord(correctWord), ...distractors]);
}

function renderQuiz(){
  if(qzState.i >= qzState.deck.length){
    main.innerHTML = `
      <div class="crumbs">${crumbHtml(qzState)}</div>
      <div class="fc-done">
        <div style="font-size:44px;">🏁</div>
        <div class="big">Score: ${qzState.score} / ${qzState.deck.length}</div>
        <div class="fc-controls" style="margin-top:20px;">
          <button class="btn primary" id="qzAgain">Try again</button>
          <button class="btn teal" id="qzFlash">Review with flashcards</button>
          <button class="btn" id="qzBack">${qzState.cat ? "Back to subcategories" : "Back to categories"}</button>
        </div>
      </div>
    `;
    bindCrumbs();
    document.getElementById("qzAgain").addEventListener("click", ()=>{
      if(qzState.cat) startQuiz(qzState.cat.id, qzState.sub.id);
      else startQuizSession(qzState.sourceWords, qzState.label);
    });
    document.getElementById("qzFlash").addEventListener("click", ()=>{
      if(qzState.cat) startFlashcards(qzState.cat.id, qzState.sub.id);
      else startFlashcardsSession(qzState.sourceWords, qzState.label);
    });
    document.getElementById("qzBack").addEventListener("click", ()=>{
      if(qzState.cat) renderCategory(qzState.cat.id);
      else setView("home");
    });
    return;
  }
  const w = qzState.deck[qzState.i];
  const pool = qzState.cat
    ? (allWordsFromWholeCategory(qzState.cat).length > 6 ? allWordsFromWholeCategory(qzState.cat) : allWords())
    : allWords();
  const direction = Math.random() < 0.5 ? "ar2en" : "en2ar";
  const correctText = direction==="ar2en" ? w.e : displayWord(w);
  const options = direction==="ar2en"
    ? buildOptions(w, pool.filter(x=>x.a!==w.a).concat([w]))
    : buildOptionsReverse(w, pool.filter(x=>x.a!==w.a).concat([w]));
  const promptHtml = direction==="ar2en"
    ? `<div class="quiz-word">${displayWord(w)}<button class="speak-btn quiz-speak-btn" id="quizSpeakBtn" title="Listen">🔊</button></div>
       <div class="quiz-translit">${w.t}</div>`
    : `<div class="quiz-direction-label">Choose the Arabic word for:</div>
       <div class="quiz-word quiz-word-en">${w.e}</div>`;
  main.innerHTML = `
    <div class="crumbs">${crumbHtml(qzState, " — Quiz")}</div>
    <div class="quiz-wrap">
      <div class="quiz-score">Question ${qzState.i+1} of ${qzState.deck.length} · Score ${qzState.score}</div>
      ${w.isPopQuiz ? '<div class="popquiz-badge">🔔 Pop quiz — you marked this mastered before</div>' : ""}
      ${promptHtml}
      <div class="quiz-options" id="quizOptions"></div>
      <div class="quiz-next" id="quizNextWrap" style="display:none;"><button class="btn primary" id="quizNext">Next →</button></div>
    </div>
  `;
  bindCrumbs();
  const speakBtn = document.getElementById("quizSpeakBtn");
  if(speakBtn) speakBtn.addEventListener("click", (e)=>{ e.stopPropagation(); speak(w.tk || w.a); });
  const optWrap = document.getElementById("quizOptions");
  options.forEach(optText=>{
    const btn = document.createElement("div");
    btn.className="quiz-opt" + (direction==="en2ar" ? " quiz-opt-ar" : "");
    btn.textContent = optText;
    btn.addEventListener("click", ()=>{
      if(qzState.answered) return;
      qzState.answered = true;
      const correct = optText === correctText;
      if(correct) qzState.score++;
      const {demoted} = markResult(w, correct);
      if(demoted){
        qzState.deck.splice(Math.min(qzState.deck.length, qzState.i+2), 0, w);
        qzState.deck.splice(Math.min(qzState.deck.length, qzState.i+5), 0, w);
        showToast(`"${w.e}" was mastered but you missed it — you'll see it again shortly, and it may pop up in future practice too.`);
      }
      document.querySelectorAll(".quiz-opt").forEach(o=>{
        o.classList.add("disabled");
        if(o.textContent === correctText) o.classList.add("correct");
        else if(o===btn) o.classList.add("wrong");
      });
      if(direction==="en2ar"){
        const correctEl = optWrap.querySelector(".quiz-opt.correct");
        if(correctEl && !correctEl.querySelector(".speak-btn")){
          const sb = document.createElement("button");
          sb.className = "speak-btn"; sb.style.marginLeft="8px"; sb.textContent = "🔊";
          sb.addEventListener("click", (e)=>{ e.stopPropagation(); speak(w.tk || w.a); });
          correctEl.appendChild(sb);
        }
      }
      document.getElementById("quizNextWrap").style.display="block";
    });
    optWrap.appendChild(btn);
  });
  document.getElementById("quizNext").addEventListener("click", ()=>{ qzState.i++; qzState.answered=false; renderQuiz(); });
}
function allWordsFromWholeCategory(cat){
  const out=[];
  cat.subs.forEach(s=>s.words.forEach(w=>out.push(w)));
  return out;
}

/* ============================= SENTENCES ============================= */
function renderSentences(catId, subId){
  let words;
  let crumbLabel;
  if(catId && subId){
    const cat = DATA.categories.find(c=>c.id===catId);
    const sub = cat.subs.find(s=>s.id===subId);
    words = sub.words;
    crumbLabel = `<a data-nav="home">Categories</a> <span>›</span> <a data-nav="cat" data-catid="${cat.id}">${cat.en}</a> <span>›</span> <span>${sub.en} — Sentences</span>`;
  } else {
    words = allWords();
    crumbLabel = `<span>All Sentences</span>`;
  }
  main.innerHTML = `
    <div class="crumbs">${crumbLabel}</div>
    <div class="section-label">Sentence practice</div>
    <p style="color:var(--text-muted); font-size:14px; max-width:640px; margin-bottom:24px;">Every sentence uses a vocabulary word in context. Hover or tap any Arabic word for its meaning, and tap “Show translation” to check the full sentence.</p>
    <div id="sentList"></div>
  `;
  const homeCrumb = main.querySelector('[data-nav="home"]');
  if(homeCrumb) homeCrumb.addEventListener("click", ()=>setView("home"));
  const catCrumb = main.querySelector('[data-nav="cat"]');
  if(catCrumb) catCrumb.addEventListener("click", ()=>renderCategory(catCrumb.dataset.catid));

  const list = document.getElementById("sentList");
  words.forEach((w,idx)=>{
    const div = document.createElement("div");
    div.className="sentence-card";
    div.innerHTML = `
      <div class="sentence-ar">${highlightSentence(w)}</div>
      <span class="sentence-toggle" data-idx="${idx}">Show translation ▾</span>
      <div class="sentence-en" id="sen-${idx}">${w.x}</div>
    `;
    list.appendChild(div);
  });
  list.querySelectorAll(".sentence-toggle").forEach(t=>{
    t.addEventListener("click", ()=>{
      const target = document.getElementById(`sen-${t.dataset.idx}`);
      target.classList.toggle("show");
      t.textContent = target.classList.contains("show") ? "Hide translation ▴" : "Show translation ▾";
    });
  });
}
function highlightSentence(w){
  // wrap the target word inside the example sentence with a tooltip span, rest plain
  if(w.s.includes(w.a)){
    return w.s.replace(w.a, wordTip(w));
  }
  return w.s + " " + wordTip(w, 15);
}

/* ============================= RENDER: REVIEW ============================= */

    const p = PROGRESS[w.id];
    return p && (p.status==="mastered" || p.status==="shaky");
  });
  const shakyCount = pool.filter(w=>PROGRESS[w.id].status==="shaky").length;
  main.innerHTML = `
    <div class="hero" style="padding:6px 0 18px; text-align:left;">
      <h1 class="hero-title" style="margin-top:0;">Review <em>mastered words</em></h1>
      <p class="alpha-intro">This mode only pulls from words you've marked as mastered — a spaced check-in to make sure they've actually stuck. Miss one here and it gets flagged "needs retest": you'll see it a couple more times right away, and it may randomly pop up during your regular practice too, until you've nailed it consistently again.</p>
    </div>
    ${pool.length===0 ? `
      <div class="verb-note">You haven't mastered any words yet. Practice flashcards or a quiz until a word's correct-answer streak builds up (${MASTERY_STREAK} in a row) — it'll show up here automatically once it's ready for review.</div>
    ` : `
      <div class="progress-wrap" style="margin-top:0;">
        <div class="progress-header"><span>Ready for review</span><span class="progress-pct">${pool.length} words</span></div>
        ${shakyCount>0 ? `<div class="mnemonic" style="margin-top:8px;">⚠️ ${shakyCount} word${shakyCount>1?"s":""} currently flagged "needs retest" — ${shakyCount>1?"they're":"it's"} included below.</div>` : ""}
      </div>
      <div class="quick-actions">
        <button class="btn primary" id="reviewFlash">🎯 Review Flashcards</button>
        <button class="btn teal" id="reviewQuiz">🧪 Review Quiz</button>
      </div>
    `}
  `;
  if(pool.length){
    document.getElementById("reviewFlash").addEventListener("click", ()=>startFlashcardsSession(pool, "Review"));
    document.getElementById("reviewQuiz").addEventListener("click", ()=>startQuizSession(pool, "Review"));
  }
}

/* ============================= RENDER: HISTORY ============================= */
function renderHistory(){
  const all = allWords();
  const withProgress = all.filter(w=>PROGRESS[w.id]);
  main.innerHTML = `
    <div class="hero" style="padding:6px 0 18px; text-align:left;">
      <h1 class="hero-title" style="margin-top:0;">Your <em>history</em></h1>
      <p class="alpha-intro">${withProgress.length} of ${all.length} words practiced so far.</p>
    </div>
    <div class="grammar-explainer" style="padding:18px 22px;">
      <h3 style="margin-bottom:6px;">💾 Backing up your progress</h3>
      <p class="alpha-intro" style="margin-bottom:14px;">If you ever get an updated copy of this app — a new file, a new device, a fresh download — your progress won't automatically carry over. Export it here first, then import it into the new copy to restore everything exactly as it was.</p>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn teal" id="exportProgressBtn">⬇️ Export progress</button>
        <button class="btn teal" id="importProgressBtn">⬆️ Import progress</button>
        <input type="file" id="importProgressFile" accept="application/json" style="display:none;">
      </div>
    </div>
    <div class="diff-bar" id="histFilterBar"></div>
    <div id="histList" style="margin-top:14px;"></div>
    ${withProgress.length ? '<div style="margin-top:24px;"><button class="btn" id="resetProgressBtn">Reset all progress</button></div>' : ""}
  `;
  document.getElementById("exportProgressBtn").addEventListener("click", exportProgress);
  const importBtn = document.getElementById("importProgressBtn");
  const importInput = document.getElementById("importProgressFile");
  importBtn.addEventListener("click", ()=>importInput.click());
  importInput.addEventListener("change", (e)=>{
    if(e.target.files && e.target.files[0]) importProgressFile(e.target.files[0]);
  });

  let filter = "all";
  const filterBar = document.getElementById("histFilterBar");
  const filters = [["all","mixed","All"],["mastered","easy","Mastered"],["shaky","expert","Needs retest"],["learning","medium","Learning"]];
  function drawFilterBar(){
    filterBar.innerHTML = filters.map(([key,cls,lbl])=>`
      <button class="diff-pill ${cls} ${filter===key?"active":""}" data-f="${key}"><span class="dot"></span>${lbl}</button>
    `).join("");
    filterBar.querySelectorAll("button").forEach(b=>b.addEventListener("click", ()=>{ filter=b.dataset.f; drawFilterBar(); drawList(); }));
  }
  function drawList(){
    const listEl = document.getElementById("histList");
    let rows = withProgress.filter(w=> filter==="all" || PROGRESS[w.id].status===filter);
    rows.sort((a,b)=> (PROGRESS[b.id].lastSeen||0) - (PROGRESS[a.id].lastSeen||0));
    if(rows.length===0){ listEl.innerHTML = `<p style="color:var(--text-muted); padding:20px 0;">No words in this category yet.</p>`; return; }
    listEl.innerHTML = rows.map(w=>{
      const p = PROGRESS[w.id];
      const statusLabel = p.status==="shaky" ? "Needs retest" : p.status.charAt(0).toUpperCase()+p.status.slice(1);
      const badgeCls = p.status==="mastered" ? "easy" : p.status==="shaky" ? "expert" : "medium";
      return `<div class="hist-row">
        <div class="hist-word">${w.a}<span class="hist-meta">${w.t} — ${w.e}</span></div>
        <div class="hist-cat">${w.cat.en} / ${w.sub.en}</div>
        <span class="diff-badge ${badgeCls}">${statusLabel}</span>
        <div class="hist-stats">${p.correct}✓ / ${p.wrong}✗ · seen ${p.seen}×</div>
        <div class="hist-when">${timeAgo(p.lastSeen)}</div>
      </div>`;
    }).join("");
  }
  drawFilterBar();
  drawList();
  const resetBtn = document.getElementById("resetProgressBtn");
  if(resetBtn) resetBtn.addEventListener("click", async ()=>{
    if(confirm("Reset all your practice progress? This can't be undone.")){
      PROGRESS = {};
      await saveProgressNow();
      renderHistory();
    }
  });
}

function exportProgress(){
  const payload = { app:"mufradat", formatVersion:1, exportedAt:new Date().toISOString(), wordCount:Object.keys(PROGRESS).length, progress:PROGRESS };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "mufradat-progress-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("Progress exported — keep that file somewhere safe.");
}

function importProgressFile(file){
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const payload = JSON.parse(e.target.result);
      const incoming = (payload && typeof payload==="object" && payload.progress) ? payload.progress : payload;
      if(!incoming || typeof incoming !== "object" || Array.isArray(incoming)) throw new Error("bad format");
      const beforeCount = Object.keys(PROGRESS).length;
      PROGRESS = {...PROGRESS, ...incoming};
      await saveProgressNow();
      const importedCount = Object.keys(incoming).length;
      showToast(`Imported ${importedCount} words' progress (you now have ${Object.keys(PROGRESS).length} tracked total).`);
      renderHistory();
    }catch(err){
      showToast("Couldn't read that file — make sure it's a Mufradat progress export.");
    }
  };
  reader.readAsText(file);
}

/* ============================= SENTENCE BUILDER ============================= */
let builderState = {};

function getBuilderPool(){
  // hand-written sentences only, and only ones with 2+ words — a single-word
  // "sentence" (common with attached object pronouns) makes a trivial, pointless puzzle.
  return allWords().filter(w=>!w.auto && tokenize(w.s).length>=2);
}
function tokenize(sentence){
  return sentence.replace(/[.؟،]+$/,"").trim().split(/\s+/);
}
function shuffleTokensNontrivial(tokens){
  const base = tokens.map((t,i)=>({text:t, uid:i+"_"+Math.random().toString(36).slice(2)}));
  if(base.length<=1) return base;
  let arr, tries=0;
  do{
    arr = shuffle(base);
    tries++;
  } while(arr.map(x=>x.text).join(" ")===tokens.join(" ") && tries<10);
  return arr;
}
function startBuilder(){
  const pool = getBuilderPool();
  builderState = { pool, idx: Math.floor(Math.random()*pool.length) };
  loadBuilderSentence();
}
function loadBuilderSentence(){
  const w = builderState.pool[builderState.idx];
  const tokens = tokenize(w.s);
  builderState.tokens = tokens;
  builderState.bank = shuffleTokensNontrivial(tokens);
  builderState.placed = [];
  builderState.attempts = 0;
  builderState.currentWord = w;
  renderBuilder();
}
function nextBuilderSentence(){
  let newIdx;
  do{ newIdx = Math.floor(Math.random()*builderState.pool.length); } while(newIdx===builderState.idx && builderState.pool.length>1);
  builderState.idx = newIdx;
  loadBuilderSentence();
}
function renderBuilder(){
  const w = builderState.currentWord;
  main.innerHTML = `
    <div class="hero" style="padding:6px 0 18px; text-align:left;">
      <h1 class="hero-title" style="margin-top:0;">Sentence <em>builder</em></h1>
      <p class="alpha-intro">Tap the Arabic words below, in order, to build the sentence that matches the English prompt. Tap a placed word to send it back to the bank.</p>
    </div>
    <div class="builder-prompt">
      <div class="builder-prompt-label">Build this sentence</div>
      <div class="builder-prompt-en">"${w.x}"</div>
    </div>
    <div class="builder-answer" id="builderAnswer"></div>
    <div class="builder-bank" id="builderBank"></div>
    <div class="builder-controls">
      <button class="btn" id="builderShuffle">🔀 Shuffle bank</button>
      <button class="btn teal" id="builderHint">💡 Hint</button>
      <button class="btn primary" id="builderCheck">✓ Check</button>
      <button class="btn" id="builderSkip">Skip →</button>
    </div>
    <div class="builder-feedback" id="builderFeedback"></div>
  `;
  drawBuilderAnswer();
  drawBuilderBank();
  document.getElementById("builderShuffle").addEventListener("click", ()=>{ builderState.bank = shuffle(builderState.bank); drawBuilderBank(); });
  document.getElementById("builderCheck").addEventListener("click", checkBuilder);
  document.getElementById("builderHint").addEventListener("click", showBuilderHint);
  document.getElementById("builderSkip").addEventListener("click", nextBuilderSentence);
}
function drawBuilderAnswer(){
  const el = document.getElementById("builderAnswer");
  if(builderState.placed.length===0){
    el.innerHTML = '<span class="builder-placeholder">Tap words below to build your sentence…</span>';
    return;
  }
  el.innerHTML = builderState.placed.map(tok=>`<button class="tile placed" data-uid="${tok.uid}">${tok.text}</button>`).join("");
  el.querySelectorAll(".tile").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const uid = btn.dataset.uid;
      const idx = builderState.placed.findIndex(t=>t.uid===uid);
      const [tok] = builderState.placed.splice(idx,1);
      builderState.bank.push(tok);
      drawBuilderAnswer(); drawBuilderBank();
      document.getElementById("builderFeedback").innerHTML = "";
    });
  });
}
function drawBuilderBank(){
  const el = document.getElementById("builderBank");
  el.innerHTML = builderState.bank.map(tok=>`<button class="tile" data-uid="${tok.uid}">${tok.text}</button>`).join("");
  el.querySelectorAll(".tile").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const uid = btn.dataset.uid;
      const idx = builderState.bank.findIndex(t=>t.uid===uid);
      const [tok] = builderState.bank.splice(idx,1);
      builderState.placed.push(tok);
      drawBuilderAnswer(); drawBuilderBank();
    });
  });
}
function checkBuilder(){
  const attemptStr = builderState.placed.map(t=>t.text).join(" ");
  const correctStr = builderState.tokens.join(" ");
  const fb = document.getElementById("builderFeedback");
  if(builderState.placed.length < builderState.tokens.length){
    fb.innerHTML = `<div class="builder-wrong">Place all the words first — ${builderState.tokens.length - builderState.placed.length} left.</div>`;
    return;
  }
  builderState.attempts++;
  markResult(builderState.currentWord, attemptStr===correctStr);
  if(attemptStr === correctStr){
    fb.innerHTML = `<div class="builder-correct">✅ Correct!</div>`;
    setTimeout(nextBuilderSentence, 1400);
  } else if(builderState.attempts>=3){
    fb.innerHTML = `<div class="builder-wrong">Not quite. The correct sentence is: <span class="ar-inline">${builderState.currentWord.s}</span></div>`;
    setTimeout(nextBuilderSentence, 3200);
  } else {
    fb.innerHTML = `<div class="builder-wrong">Not quite right — try rearranging (attempt ${builderState.attempts}/3).</div>`;
  }
}
function showBuilderHint(){
  const fb = document.getElementById("builderFeedback");
  const nextWord = builderState.tokens[builderState.placed.length];
  if(nextWord){
    fb.innerHTML = `<div class="builder-hint">💡 The next word is <span class="ar-inline">${nextWord[0]}‏‏‏‏‏‏‏‏ـ</span> (${nextWord.length} letters)</div>`;
  } else {
    fb.innerHTML = `<div class="builder-hint">💡 You've placed every word — hit Check!</div>`;
  }
}

/* ============================= SEARCH ============================= */
const searchInput = document.getElementById("searchInput");
const searchResults = document.getElementById("searchResults");

searchInput.addEventListener("input", ()=>{
  const q = searchInput.value.trim().toLowerCase();
  if(!q){ searchResults.classList.remove("show"); searchResults.innerHTML=""; return; }
  const matches = allWords().filter(w=>
    w.a.includes(q) || w.t.toLowerCase().includes(q) || w.e.toLowerCase().includes(q)
  ).slice(0,10);
  if(matches.length===0){
    searchResults.innerHTML = `<div class="search-empty">No words found for “${searchInput.value}”.</div>`;
  } else {
    searchResults.innerHTML = matches.map(w=>`
      <div class="search-row" data-cat="${w.cat.id}" data-sub="${w.sub.id}">
        <span class="ar">${w.a}</span>
        <span class="meta">${w.t} — ${w.e}<br><span style="opacity:.7">${w.cat.en} / ${w.sub.en}</span></span>
      </div>
    `).join("");
  }
  searchResults.classList.add("show");
});
searchResults.addEventListener("click", (e)=>{
  const row = e.target.closest(".search-row");
  if(!row) return;
  searchResults.classList.remove("show");
  searchInput.value="";
  renderSentences(row.dataset.cat, row.dataset.sub);
});
document.addEventListener("click", (e)=>{
  if(!e.target.closest(".search-wrap")) searchResults.classList.remove("show");
});

/* ============================= TOOLTIP: long-press for touch ============================= */
let pressTimer=null;
document.addEventListener("touchstart", (e)=>{
  const tip = e.target.closest(".w-tip");
  if(!tip) return;
  pressTimer = setTimeout(()=>{ tip.classList.add("show-tip"); }, 380);
});
document.addEventListener("touchend", (e)=>{
  clearTimeout(pressTimer);
  document.querySelectorAll(".w-tip.show-tip").forEach(el=>{
    setTimeout(()=>el.classList.remove("show-tip"), 1400);
  });
});

/* ============================= INIT ============================= */
function render(){
  if(state.view==="home") renderHome();
  else if(state.view==="category") renderCategory(state.catId);
  else if(state.view==="sentences-all") renderSentences(null,null);
  else if(state.view==="alphabet") renderAlphabet();
  else if(state.view==="conjugations"){ conjState.verb=null; renderConjugations(); }
  else if(state.view==="review") renderReview();
  else if(state.view==="history") renderHistory();
  else if(state.view==="builder") startBuilder();
  else if(state.view==="roots") renderRoots();
}
(async function init(){
  assignWordIds();
  buildWordsById();
  await loadProgress();
  await loadStreak();
  render();
  // Service worker: only registers over HTTPS/localhost (browsers block it on file:// pages).
  // This is what makes offline use + "Install app" work once this is hosted somewhere.
  if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost")){
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  }
})();
</script>
